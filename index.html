// ── Rain puddles ──
function updatePuddles(dt){
  if(weatherMode!=='rain'){puddles.length=0;return;}
  if(puddles.length<FX.puddleMax&&Math.random()<0.004*dt)
    puddles.push({x:PX+30+Math.random()*(PW-60),y:PY+20+Math.random()*(PH-40),r:1,maxR:5+Math.random()*8});
  for(const pd of puddles)if(pd.r<pd.maxR)pd.r+=0.01*dt*weatherFade;
  if(Math.random()<0.06*dt&&puddles.length){const pd=puddles[Math.floor(Math.random()*puddles.length)];
    spawnRing(pd.x+(Math.random()-0.5)*pd.r*2,pd.y-5+(Math.random()-0.5)*pd.r*0.6,'rgba(200,225,255,0.5)',3+Math.random()*3,0.6);}
  if(Math.random()<FX.lightningChance*dt*weatherFade){lightningT=12;addShake(0.8);}
}
function puddleAt(x,y){
  return puddles.find(pd=>((x-pd.x)/(pd.r*2))**2+((y-pd.y)/(pd.r*0.8))**2<1);
}
function drawPuddles(){
  for(const pd of puddles){
    cx.fillStyle='rgba(70,110,150,0.42)'; cx.beginPath(); cx.ellipse(pd.x,pd.y,pd.r*2,pd.r*0.8,0,0,Math.PI*2); cx.fill();
    cx.strokeStyle='rgba(210,230,255,0.35)'; cx.lineWidth=0.6;
    cx.beginPath(); cx.ellipse(pd.x-pd.r*0.4,pd.y-pd.r*0.15,pd.r*1.1,pd.r*0.3,0,Math.PI*1.1,Math.PI*1.9); cx.stroke();
  }
}

// ── Ball motion trail for fast shots ──
function updateBallTrail(){
  const sp=Math.hypot(ball.vx,ball.vy);
  if(!ball.owner&&sp>3.5)ballTrail.push({x:ball.x,y:ball.y-ball.z,sp});
  else if(ballTrail.length)ballTrail.shift();
  while(ballTrail.length>8)ballTrail.shift();
}
function drawBallTrail(){
  const col=ball.onFire?'255,140,40':ball.isCurveShot?'110,170,255':'255,255,230';
  ballTrail.forEach((b,i)=>{
    const k=(i+1)/ballTrail.length;
    cx.fillStyle=`rgba(${col},${0.35*k})`;
    cx.beginPath(); cx.arc(b.x,b.y,BRAD*(0.45+0.5*k),0,Math.PI*2); cx.fill();
  });
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function updateCamera(dt){
  // Look slightly ahead of the ball's travel so passes and shots stay in view
  const tx=ball.x+ball.vx*CANVAS.cameraLead, ty=ball.y+ball.vy*CANVAS.cameraLead;
  const k=1-Math.pow(1-CANVAS.cameraFollow,dt);
  camX+=(tx-camX)*k; camY+=(ty-camY)*k;
  // Keep the view inside the world; centre it on any axis where the view is bigger
  const z=camZ*(1+camPunch), hw=VW/(2*z), hh=VH/(2*z);
  camX=hw*2>=LW?LW/2:clamp(camX,hw,LW-hw);
  camY=hh*2>=LH?LH/2:clamp(camY,hh,LH-hh);
}
function applyCamera(){
  const z=camZ*(1+camPunch);
  const sx=shakeMag?Math.round((Math.random()-0.5)*2*shakeMag):0, sy=shakeMag?Math.round((Math.random()-0.5)*2*shakeMag):0;
  cx.translate(VW/2+sx,VH/2+sy); cx.scale(z,z); cx.translate(-camX,-camY);
}

function getTeamStars(def){
  const out=[];
  for(const f of def.formation){
    const s=f.skills.find(s=>Array.isArray(s)&&s[1]>=3);
    if(s)out.push({name:f.name,skill:s[0],isGK:f.role==='gk'});
    else if(f.role==='gk'&&(f.gkRating??1)>=3)out.push({name:f.name,skill:'gk',isGK:true});

function initLeague(playerIdx){
  const n=ALL_TEAMS.length;
  const fix=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)fix.push({h:i,a:j,played:false,hg:0,ag:0});
  for(let i=fix.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fix[i],fix[j]]=[fix[j],fix[i]];}
  const standings=ALL_TEAMS.map((_,i)=>({idx:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  leagueState={playerIdx,fixtures:fix,standings,cur:0,playerIsHome:true};
}
function applyResult(f){
  const s=leagueState.standings;
  const hS=s.find(x=>x.idx===f.h),aS=s.find(x=>x.idx===f.a);
  hS.p++;aS.p++;hS.gf+=f.hg;hS.ga+=f.ag;aS.gf+=f.ag;aS.ga+=f.hg;
  if(f.hg>f.ag){hS.w++;hS.pts+=3;aS.l++;}
  else if(f.hg<f.ag){aS.w++;aS.pts+=3;hS.l++;}
  else{hS.d++;hS.pts++;aS.d++;aS.pts++;}
  f.played=true;
}
function simulateNonPlayer(){
  if(!leagueState)return;
  const{fixtures,playerIdx}=leagueState;
  while(leagueState.cur<fixtures.length){
    const f=fixtures[leagueState.cur];
    if(f.h===playerIdx||f.a===playerIdx)break;
    f.hg=Math.floor(Math.random()*4);f.ag=Math.floor(Math.random()*4);
    applyResult(f);leagueState.cur++;
  }
}
function sortedStandings(){
  return [...leagueState.standings].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
}

function notchedPath(x,y,w,h,n=10){
  cx.beginPath();

  cx.lineTo(x+w,y+n);
  cx.lineTo(x+w,y+h);
  cx.lineTo(x+n,y+h);
  cx.lineTo(x,y+h-n);
  cx.closePath();
}

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTS)/16.67,4);
  lastTS=ts;
  const inp=readInput();
  setTouchMode(menuState!=='match'?'menu':paused?'paused':'play',
    menuState==='match'&&ball?{mine:ball.owner?.team==='home',theirs:ball.owner?.team==='away'}:null);
  // Music on entering any menu (title on load, or back from a match)
  const inMenu=menuState!=='match';
  if(inMenu&&!wasInMenu){playRetroMusic();stopAmbience();}
  wasInMenu=inMenu;
  if(menuState!=='match'){drawMenu(inp);return;}
  if(inp.pausePressed&&(phase==='play'||phase==='kickoff'||paused)){
    paused=!paused;
    if(paused) playRetroMusic(); else stopRetroMusic();
  }
  if(paused){
      if(inp.quitPressed) { paused=false; handleMatchEnd(); return; }
      cx.save();cx.scale(SC,SC);cx.translate(VOX,VOY);drawPauseOverlay();cx.restore();return;
  }
  // Slow-motion decay
  if(slowMoTimer>0)slowMoTimer=Math.max(0,slowMoTimer-dt);
  const SM=BALANCE.slowMo;
  const slowFrac=slowMoTimer>0?slowMoTimer/SM.duration:0;
  const physDt=hitStop>0?0:dt*(slowFrac>0?lerp(1,SM.factor,slowFrac):1);
  tickFx(dt);
  updateCallouts(dt);
  tickCommentary(dt);

  // Trail decay
  for(const t of trails)t.a-=BALANCE.trail.decayRate*dt;
  trails.splice(0,trails.length,...trails.filter(t=>t.a>0));

  tickCrowd(ball.x,PX,PW,phase);
  updateWeather(dt);
  // Tick speech bubbles
  if(ball.onFire && !ball.owner) {
    if(Math.random()<0.8) spawnSparks(ball.x, ball.y, 'orange', 1);
  }
  for(const p of [...home,...away]){
    if(p.speechBubble){p.speechBubble.t+=dt;if(p.speechBubble.t>=p.speechBubble.maxT)p.speechBubble=null;}
  }

  if(phase==='kickoff'){
    if(cpuTestMode){
      // CPU kicks off immediately
      if(Math.random()<0.012*dt){phase='play';ball.vx=(koTeam===0?1:-1)*2.5;ball.vy=(Math.random()-0.5)*0.5;ball.owner=null;stopRetroMusic();sndWhistle();}
      aiUpdate(home,away,dt); aiUpdate(away,home,dt);
    } else {
      koTimer+=dt;
      if(koTeam===0){
        // Home kickoff — P1 controls holder; auto-pass to partner after 1s
        updateControlled(home[ctrlIdx],inp,dt,ctrl1);
        if(!koPassDone&&koTimer>62&&ball.owner===koHolder&&koPartner){
          const[bx,by]=nrm(koPartner.x-koHolder.x,koPartner.y-koHolder.y);
          ball.vx=bx*4.0;ball.vy=by*4.0;ball.owner=null;koPassDone=true;
        }
        if(Math.hypot(ball.vx,ball.vy)>0.5){phase='play';stopRetroMusic();sndWhistle();}
      } else {
        // Away kickoff: P2 controls if p2Mode, otherwise auto-pass
        if(p2Mode){
          const inp2=readInput2();
          updateControlled(away[ctrlIdx2],inp2,dt,ctrl2);
          if(!koPassDone&&koTimer>62&&ball.owner===koHolder&&koPartner){
            const[bx,by]=nrm(koPartner.x-koHolder.x,koPartner.y-koHolder.y);
            ball.vx=bx*4.0;ball.vy=by*4.0;ball.owner=null;koPassDone=true;
          }
        } else {
          if(!koPassDone&&koTimer>55&&koHolder&&koPartner){
            const[bx,by]=nrm(koPartner.x-koHolder.x,koPartner.y-koHolder.y);
            ball.vx=bx*4.0;ball.vy=by*4.0;ball.owner=null;koPassDone=true;
          }
        }
        if(!ball.owner&&Math.hypot(ball.vx,ball.vy)>0.5){phase='play';stopRetroMusic();sndWhistle();}
      }
    }
    updateBall(dt);updateParticles(dt);updateRings(dt);
  }

  if(phase==='play'){
    timer-=dt*(16.67/1000);
    if(timer<=0){timer=0;phase='end';}
    updateBall(physDt);
    tickPossession(physDt);
    if(phase==='play'){
    if(cpuTestMode){
      // Full CPU-vs-CPU — home team also AI-controlled
      aiUpdate(home,away,physDt);
      aiUpdate(away,home,physDt);
    } else {
      // P1 — home team
      if(inp.swPressed)switchBest();
      if(ball.owner?.team==='home'&&!ball.owner.controlled){
        const idx=home.indexOf(ball.owner);if(idx>=0)switchTo(idx);
      }
      updateControlled(home[ctrlIdx],inp,physDt,ctrl1);
      // P2 — away team (human or AI)
      if(p2Mode){
        const inp2=readInput2();
        if(inp2.swPressed)switchBest2();
        if(ball.owner?.team==='away'&&!ball.owner.controlled){
          const idx=away.indexOf(ball.owner);if(idx>=0)switchTo2(idx);
        }
        updateControlled(away[ctrlIdx2],inp2,physDt,ctrl2);
      }
      aiUpdate(home,away,physDt);
      aiUpdate(away,home,physDt);
    }
    }
    separatePlayers();
    // GK save detection — fires when GK catches a fast moving ball
    const curGK=ball.owner?.role==='gk'?ball.owner:null;
    if(curGK&&curGK!==prevGKOwner&&Math.abs(ball.vx)+Math.abs(ball.vy)>2.5){
      const gkR2=curGK.gkRating??1;
      const saveLbl=gkR2>=3?'WORLD CLASS SAVE! 🧤':gkR2>=2?'GREAT SAVE! 🧤':'SAVED! 🧤';
      showCallout(saveLbl,curGK.x,curGK.y-28,75);
      const sayCel=gkR2>=3?['E HOLD AM!','LIKE A WALL!','NAIJA GK!!!']:['GK CHOKE AM!','NO WAY!!!'];
      curGK.speechBubble={text:sayCel[Math.floor(Math.random()*sayCel.length)],t:0,maxT:160};
      triggerCommentary('save');
      if(gkR2>=2)crowdReact('crowd-shocked');
    }
    prevGKOwner=ball.owner?.role==='gk'?ball.owner:null;
    updateParticles(physDt);
    updateRings(dt);
    if(devStats&&ball.owner)devStats.possession[ball.owner.team==='home'?0:1]++;
  }

  if(phase==='goal'){updateBall(physDt);updateParticles(physDt);updateRings(dt);}

  if(phase==='end'){
    if(cpuTestMode){
      // Log match and auto-restart
      if(!cpuRestartTimer)cpuRestartTimer=Date.now();
      if(Date.now()-cpuRestartTimer>1800){
        const tot=(devStats.possession[0]+devStats.possession[1])||1;
        logCpuMatch(score[0],score[1],devStats.possession[0],tot,devStats.shots.slice());
        initMatch();resetDevStats();cpuRestartTimer=null;
      }
    } else if(inp.kickHeld&&!ctrl1.prevKickHeld){
      handleMatchEnd();
    }
  }
  ctrl1.prevKickHeld=inp.kickHeld;

  // ── RENDER ──────────────────────────────────────────────────────────────
  updateCamera(dt);
  cx.save();cx.scale(SC,SC);
  cx.fillStyle='#050A05'; cx.fillRect(0,0,VW,VH);
  cx.save();applyCamera();
  cx.drawImage(pitchBg,0,0);
  cx.drawImage(wearC,0,0);
  drawNetFx();
  drawPuddles();
  if(weatherFade>0&&weatherMode==='rain'){cx.fillStyle=`rgba(10,22,45,${0.12*weatherFade})`;cx.fillRect(PX,PY,PW,PH);}
  drawCrowd();
  drawBoards();
  drawManagers();

  // ── Goal proximity glow ──────────────────────────────────────────────────
  if(phase==='play'){
    const GP=BALANCE.goalProximity;
    const distL=Math.hypot(ball.x-PX,      ball.y-MY);
    const distR=Math.hypot(ball.x-(PX+PW),  ball.y-MY);
    const inMouth=ball.y>MY-GH/2&&ball.y<MY+GH/2;
    if(inMouth){
      for(const [gx,dist] of [[PX,distL],[PX+PW,distR]]){
        if(dist<GP.glowRange){
          const intensity=1-dist/GP.glowRange;
          const grad=cx.createRadialGradient(gx,MY,0,gx,MY,GH);
          grad.addColorStop(0,`rgba(255,80,0,${0.32*intensity})`);
          grad.addColorStop(1,'rgba(255,60,0,0)');
          cx.fillStyle=grad;
          cx.fillRect(gx-GH,MY-GH,GH*2,GH*2);
        }
      }
    }
  }

  // Snow piles on the grass (drawn before players so they appear to stand on them)
  if(snowPiles.length>0){
    cx.globalAlpha=0.50;cx.fillStyle='#dceeff';
    for(const sp of snowPiles){
      cx.beginPath();cx.ellipse(Math.round(sp.x),Math.round(sp.y),sp.r*2.4,sp.r*0.7,0,0,Math.PI*2);cx.fill();
    }
    cx.globalAlpha=1;
  }

  // Slow-motion tint overlay
  if(slowFrac>0){cx.fillStyle=`rgba(20,0,50,${slowFrac*0.38})`;cx.fillRect(0,0,LW,LH);}

  drawParticles();
  drawRings();

  // ghost trails
  for(const t of trails)drawPlayer(t.x,t.y,t.tc,t.frame,'run',t.dir,t.a);

  // players sorted by Y
  const all=[...home,...away].sort((a,b)=>a.y-b.y);
  for(const p of all){
    const tc=COL[p.team];
    // Wind/speed lines behind running players
    if(p.state==='run'){
      cx.save();
      cx.globalAlpha=0.18+Math.sin(Date.now()*0.048+p.x*0.1)*0.07;
      cx.strokeStyle=p.team==='home'?'#86efac':'#fca5a5';
      cx.lineWidth=0.8;
      for(let i=0;i<3;i++){
        const lx=p.x-p.dir*(7+i*4);
        const ly=p.y-1+i*3-3;
        cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(lx-p.dir*(3+i*2),ly);cx.stroke();
      }
      cx.restore();
    }
    // Feint shimmer — offset x by wobble when debuffed
    const shimX=p.feinted?Math.sin(Date.now()*0.04)*BALANCE.feint.shimmerAmp:0;
    // GK gets distinct shirt + gloves via modified tc
    const drawTc=p.role==='gk'?{...tc,shirt:tc.gkShirt??tc.shirt,gloves:tc.gloves}:tc;
    drawPlayer(p.x+shimX,p.y,drawTc,p.frame,p.state,p.dir,p.feinted?0.7:1,p.role==='gk');
    if(p.state==='run'&&p.frame!==p._lf&&(p.frame===0||p.frame===2)&&phase!=='kickoff')stepFx(p);
    p._lf=p.frame;
    // Controlled indicator — small dot above player head instead of ground ring
    if(p.controlled){
      const ic=p.team==='home'?'#86efac':'#fca5a5';
      cx.fillStyle=ic; cx.globalAlpha=0.85;
      cx.beginPath();cx.arc(p.x,p.y-28,2.5,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1;
    }
    // ── Overhead label ────────────────────────────────────────────────────────
    cx.textAlign='center';
    const isBallOwner=ball.owner===p;
    // Stars above ball carrier only
    if(isBallOwner&&p.overallStars>0){
      const starStr='★'.repeat(p.overallStars);
      cx.font='bold 7px monospace';
      cx.strokeStyle='rgba(0,0,0,0.8)';cx.lineWidth=2;cx.lineJoin='round';
      cx.strokeText(starStr,p.x,p.y-24);
      cx.fillStyle='#fde047';cx.fillText(starStr,p.x,p.y-24);
    }
    // Name: full when carrying, first initial only when not
    const displayName=isBallOwner?p.name:(p.name[0]+'.');
    const nameCol=isBallOwner
      ?(p.team==='home'?'#86efac':'#fca5a5')
      :(p.team==='home'?'rgba(134,239,172,0.45)':'rgba(252,165,165,0.45)');
    cx.font=isBallOwner?'bold 6px monospace':'5px monospace';
    cx.strokeStyle='rgba(0,0,0,0.65)';cx.lineWidth=1.5;
    cx.strokeText(displayName,p.x,p.y-14);
    cx.fillStyle=nameCol;cx.fillText(displayName,p.x,p.y-14);
    // Stamina bar (shown when not full)
    if(p.stamina<99){
      const sw=14,sh=2,sx=p.x-7,sy=p.y+9;
      cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(sx-0.5,sy-0.5,sw+1,sh+1);
      const sf=p.stamina/100;
      cx.fillStyle=sf>0.55?'#22c55e':sf>0.28?'#fbbf24':'#ef4444';
      cx.fillRect(sx,sy,sw*sf,sh);
    }
    // Speech bubble
    if(p.speechBubble){
      const{text,t,maxT}=p.speechBubble;
      const prog=t/maxT;
      const a=prog<0.12?prog/0.12:prog>0.72?(1-(prog-0.72)/0.28):1;
      cx.globalAlpha=Math.max(0,a);
      cx.font='bold 6px monospace';cx.textAlign='center';
      const tw=cx.measureText(text).width;
      const pad=4,bw=tw+pad*2,bh=10,bx2=p.x,by2=p.y-36;
      cx.fillStyle='rgba(15,15,15,0.82)';
      cx.fillRect(bx2-bw/2,by2-bh+1,bw,bh);
      // tail
      cx.beginPath();cx.moveTo(bx2-4,by2+1);cx.lineTo(bx2+4,by2+1);cx.lineTo(bx2,by2+6);cx.closePath();cx.fill();
      cx.fillStyle=p.team==='home'?'#86efac':'#fca5a5';
      cx.fillText(text,bx2,by2-1);
      cx.globalAlpha=1;
    }
    // GK dive flash
    if(p.role==='gk'&&p.diving){
      cx.font='5px monospace';cx.fillStyle='rgba(255,220,0,0.9)';
      cx.fillText('DIVE!',p.x,p.y-14);
    }
  }

  updateBallTrail(); drawBallTrail();
  drawBall(ball.x,ball.y,ball.z,ball.spin);

  // Trajectory arc and charge bar — P1
  if(ctrl1.kickState==='charging'){
    drawArc(home[ctrlIdx],inp,ctrl1);
    const bw=28,bh=4,bx2=home[ctrlIdx].x-bw/2,by2=home[ctrlIdx].y-24;
    cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(bx2-1,by2-1,bw+2,bh+2);
    
    const maxCharge = home[ctrlIdx].overallStars >= 3 ? 1.5 : 1.0;
    
    // Zones
    cx.fillStyle = '#fde047'; cx.fillRect(bx2, by2, bw * (0.5 / maxCharge), bh);
    cx.fillStyle = '#3b82f6'; cx.fillRect(bx2 + bw * (0.5 / maxCharge), by2, bw * (0.5 / maxCharge), bh);
    if (maxCharge > 1.0) {
        cx.fillStyle = '#f97316'; cx.fillRect(bx2 + bw * (1.0 / maxCharge), by2, bw * (0.5 / maxCharge), bh);
    }
    
    // Moving Cursor
    const cursorX = bx2 + bw * (ctrl1.kickCharge / maxCharge);
    cx.fillStyle = '#ffffff'; cx.fillRect(cursorX - 1, by2 - 1, 2, bh + 2);
  }
  // Trajectory arc and charge bar — P2
  if(p2Mode&&ctrl2.kickState==='charging'){
    const inp2Last=readInput2();
    drawArc(away[ctrlIdx2],inp2Last,ctrl2);
    const bw=28,bh=4,bx2=away[ctrlIdx2].x-bw/2,by2=away[ctrlIdx2].y-24;
    cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(bx2-1,by2-1,bw+2,bh+2);
    
    const maxCharge = away[ctrlIdx2].overallStars >= 3 ? 1.5 : 1.0;
    
    cx.fillStyle = '#fde047'; cx.fillRect(bx2, by2, bw * (0.5 / maxCharge), bh);
    cx.fillStyle = '#3b82f6'; cx.fillRect(bx2 + bw * (0.5 / maxCharge), by2, bw * (0.5 / maxCharge), bh);
    if (maxCharge > 1.0) {
        cx.fillStyle = '#f97316'; cx.fillRect(bx2 + bw * (1.0 / maxCharge), by2, bw * (0.5 / maxCharge), bh);
    }
    
    const cursorX = bx2 + bw * (ctrl2.kickCharge / maxCharge);
    cx.fillStyle = '#ffffff'; cx.fillRect(cursorX - 1, by2 - 1, 2, bh + 2);
  }

  drawCallouts();
  cx.restore();   // end camera — HUD below is screen-space
  cx.translate(VOX,VOY);
  drawCommentary();
  drawUI();
  drawConfetti();
  drawGoalBanner();
  if(lightningT>0){cx.fillStyle=`rgba(235,240,255,${(lightningT%6>2?0.45:0.15)*lightningT/12})`;cx.fillRect(-VOX,-VOY,VW,VH);}

  // Weather is drawn stretched over the whole view
  cx.save(); cx.translate(-VOX,-VOY); cx.scale(VW/LW,VH/LH);
  // ── Rain overlay ──────────────────────────────────────────────────────────
  if(weatherMode==='rain'){
    const R=BALANCE.weather.rain;
    cx.save();cx.strokeStyle='rgba(180,200,255,0.28)';cx.lineWidth=1;
    for(const s of rainStreaks.slice(0,Math.ceil(rainStreaks.length*weatherFade))){
      s.y+=R.speedY; s.x+=R.speedX;
      if(s.y>LH){s.y=-s.len;s.x=Math.random()*LW;}
      cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-R.speedX*0.6,s.y-s.len);cx.stroke();
    }
    cx.restore();
  }
  // ── Snow overlay ──────────────────────────────────────────────────────────
  if(weatherMode==='snow'){
    cx.save();cx.fillStyle='rgba(220,236,255,0.90)';
    for(const f of snowFlakes.slice(0,Math.ceil(snowFlakes.length*weatherFade))){
      f.wobble+=f.wobbleSpeed;
      f.x+=Math.sin(f.wobble)*BALANCE.weather.snow.driftAmp;
      f.y+=f.vy;
      if(f.y>LH){f.y=-4;f.x=Math.random()*LW;}
      if(f.x<0)f.x=LW; if(f.x>LW)f.x=0;
      cx.beginPath();cx.arc(f.x,f.y,f.size,0,Math.PI*2);cx.fill();
    }
    cx.restore();
  }
  cx.restore();

  cx.restore();
}
document.fonts.ready.then(()=>requestAnimationFrame(loop));
</script>
</body>
</html>
