import { unlockAudio, sndBallHit, sndBoom, sndNiceShot, sndTap, sndGoal, sndNetBoom, playVoice, startAmbience, stopAmbience, crowdReact, startCrowd, tickCrowd, stopRetroMusic, playRetroMusic, sndWhistle } from './sound.js';

// ── CANVAS ────────────────────────────────────────────────────────────────────
const cv=document.getElementById('g'), cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;

const LW = CANVAS.logicalWidth;
const LH = CANVAS.logicalHeight;
const SP = CANVAS.spritePixelSize;
let SC=1;
// Camera zoom: on small touch screens the world is zoomed and follows the ball
// (like a broadcast/side cam) so players stay readable; desktop sees the full pitch.
let camZ=1, camX=LW/2, camY=LH/2;
// View size in logical px. Touch devices fill the whole screen (wider than 5:3 on
// phones), so the camera shows more pitch sideways; menus and HUD stay centred
// at offset VOX/VOY. Desktop keeps the letterboxed 800×480 view.
let VW=LW, VH=LH, VOX=0, VOY=0;
function resize(){
  // Render at device pixel ratio so phones stay sharp.
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const fit=Math.min(innerWidth/LW,innerHeight/LH);
  const cssW=isTouchDevice?innerWidth:Math.round(LW*fit);
  const cssH=isTouchDevice?innerHeight:Math.round(LH*fit);
  SC=fit*dpr;
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
  VW=cv.width/SC; VH=cv.height/SC; VOX=(VW-LW)/2; VOY=(VH-LH)/2;
  camZ=isTouchDevice?Math.min(CANVAS.mobileZoomMax,Math.max(1,CANVAS.mobileMinScale/fit)):1;
  cx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

// ── CONSTANTS (resolved from config) ─────────────────────────────────────────
const PX=PITCH.x, PY=PITCH.y, PW=PITCH.w, PH=PITCH.h;
const MX=PITCH.midX, MY=PITCH.midY;
const GH=PITCH.goalHeight, GD=PITCH.goalDepth;
const PBW=PITCH.penaltyBoxW, PBH=PITCH.penaltyBoxH;
const PRAD=PHYSICS.player.radius, BRAD=PHYSICS.ballRadius;
const WALK=MOVEMENT.walk, SPRINTSPD=MOVEMENT.sprint;
const MATCH_S=RULES.matchDuration;

let COL={
  home: TEAMS.home.colors,
  away: TEAMS.away.colors,
};
function updateCOL(hDef,aDef){COL.home=hDef.colors;COL.away=aDef.colors;}

// ── INPUT ─────────────────────────────────────────────────────────────────────
const K={};
addEventListener('keydown',e=>{
  K[e.code]=true;
  unlockAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','KeyC'].includes(e.code))
    e.preventDefault();
  // Auto-activate P2 on first IJKL keypress
  if(!p2Mode&&['KeyI','KeyJ','KeyK','KeyL','KeyN','KeyU','KeyO','KeyM','KeyP'].includes(e.code)){
    p2Mode=true;
    if(typeof away!=='undefined'&&away){
      ctrlIdx2=away.findIndex(p=>p.role==='st');
      if(ctrlIdx2<0)ctrlIdx2=away.length-1;
      away.forEach(p=>p.controlled=false);
      away[ctrlIdx2].controlled=true;
    }
  }
});
addEventListener('keyup',e=>{ K[e.code]=false; });
initTouchControls(K,unlockAudio);

let _prevTackleBtn=false, _prevSwBtn=false, _prevPassBtn=false, _prevPauseBtn=false, _prevQuitBtn=false;
function getGP(){ const gs=navigator.getGamepads?.()??[]; for(const g of gs)if(g)return g; return null; }

function readInput(){
  let dx=0,dy=0,sprint=false,kickHeld=false,tacklePressed=false,swPressed=false,passPressed=false;
  let aimDx=0, aimDy=0;
  if(K.ArrowLeft||K.KeyA) dx-=1;
  if(K.ArrowRight||K.KeyD) dx+=1;
  if(K.ArrowUp||K.KeyW)   dy-=1;
  if(K.ArrowDown||K.KeyS)  dy+=1;
  sprint=!!(K.ShiftLeft||K.ShiftRight);
  kickHeld=!!K.Space;
  const tacBtn=!!(K.KeyC||K.ControlLeft);
  const swBtn=!!K.Tab;
  const pasKb=!!K.KeyE;
  if(stick.active){dx=stick.dx;dy=stick.dy;aimDx=dx;aimDy=dy;}
  const g=getGP();
  if(g){
    // ── Left analog stick → move ──────────────────────────────────────────
    const ax=g.axes[0], ay=g.axes[1];
    if(Math.abs(ax)>0.12)dx=ax;
    if(Math.abs(ay)>0.12)dy=ay;
    // ── Right analog stick → aim shot direction ───────────────────────────
    const rx=g.axes[2]??0, ry=g.axes[3]??0;
    if(Math.abs(rx)>0.18){aimDx=rx;}else if(Math.abs(ax)>0.15){aimDx=ax;}
    if(Math.abs(ry)>0.18){aimDy=ry;}else if(Math.abs(ay)>0.15){aimDy=ay;}
    // ── D-pad → move ──────────────────────────────────────────────────────
    if(g.buttons[12]?.pressed)dy-=1;   // D-up
    if(g.buttons[13]?.pressed)dy+=1;   // D-down
    if(g.buttons[14]?.pressed)dx-=1;   // D-left
    if(g.buttons[15]?.pressed)dx+=1;   // D-right
    // ── L2 / R2 → sprint (also L1/R1 as fallback) ────────────────────────
    sprint=!!((g.buttons[6]?.value??0)>0.25||(g.buttons[7]?.value??0)>0.25||  // L2 / R2
               g.buttons[4]?.pressed||g.buttons[5]?.pressed);                  // L1 / R1
    kickHeld=!!g.buttons[0]?.pressed;                   // × (Cross)
    const tb=!!g.buttons[1]?.pressed;                   // ○ (Circle) — tackle
    const sb=!!g.buttons[3]?.pressed;                   // △ (Triangle) — switch
    const pb=!!g.buttons[2]?.pressed;                   // □ (Square) — pass
    tacklePressed=tb&&!_prevTackleBtn; _prevTackleBtn=tb;
    swPressed   =sb&&!_prevSwBtn;     _prevSwBtn=sb;
    passPressed =pb&&!_prevPassBtn;   _prevPassBtn=pb;
  } else {
    tacklePressed=tacBtn&&!_prevTackleBtn; _prevTackleBtn=tacBtn;
    swPressed=swBtn&&!_prevSwBtn;         _prevSwBtn=swBtn;
    passPressed=pasKb&&!_prevPassBtn;     _prevPassBtn=pasKb;
  }
  const len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;}
  const aimActive=Math.hypot(aimDx,aimDy)>0.15;
  const pauseRaw=!!(K.Escape||(g?.buttons[9]?.pressed));
  const pausePressed=pauseRaw&&!_prevPauseBtn; _prevPauseBtn=pauseRaw;
  const quitRaw=!!(K.Backspace||(g?.buttons[8]?.pressed));
  const quitPressed=quitRaw&&!_prevQuitBtn; _prevQuitBtn=quitRaw;
  return{dx,dy,sprint,kickHeld,tacklePressed,swPressed,passPressed,aimDx,aimDy,aimActive,pausePressed,quitPressed};
}

// ── VIBRATION ─────────────────────────────────────────────────────────────────
function rumble(strong=0.5,weak=0.3,ms=80){
  for(const g of(navigator.getGamepads?.()??[])){
    if(!g?.vibrationActuator)continue;
    g.vibrationActuator.playEffect('dual-rumble',{startDelay:0,duration:ms,weakMagnitude:weak,strongMagnitude:strong}).catch(()=>{});
  }
}
// Named rumble helpers pulled from config
const R = POWER.rumble;
const rumbleBoom      = () => rumble(...R.boom);
const rumbleNiceShot  = () => rumble(...R.niceShot);
const rumbleTap       = () => rumble(...R.tap);
const rumbleTackle    = () => rumble(...R.tackle);
const rumbleWall      = () => rumble(...R.wall);
const rumbleBounce    = () => rumble(...R.bounce);
const rumbleGoal      = () => rumble(...R.goal);
const rumbleSprint    = () => rumble(...R.sprintBuzz);
const rumbleCpuSkill  = () => rumble(...R.cpuSkill);
let gpName='', gpName2='';
addEventListener('gamepadconnected',   e=>{
  unlockAudio();
  const pads=navigator.getGamepads?.()??[];
  let p1Set=false;
  for(const g of pads){if(!g)continue;if(!p1Set){gpName=g.id.slice(0,40);p1Set=true;}else{gpName2=g.id.slice(0,40);p2Mode=true;break;}}
});
addEventListener('gamepaddisconnected',e=>{
  const pads=navigator.getGamepads?.()??[];
  const active=Array.from(pads).filter(Boolean);
  if(active.length===0){gpName='';gpName2='';p2Mode=false;}
  else if(active.length===1){gpName=active[0].id.slice(0,40);gpName2='';p2Mode=gpName2?false:p2Mode;}
});

// ── PLAYER 2 INPUT ────────────────────────────────────────────────────────────
let _p2PrevTackleBtn=false, _p2PrevSwBtn=false, _p2PrevPassBtn=false;
function getGP2(){ const gs=navigator.getGamepads?.()??[]; let n=0; for(const g of gs){if(g){if(n===1)return g;n++;}} return null; }

function readInput2(){
  let dx=0,dy=0,sprint=false,kickHeld=false,tacklePressed=false,swPressed=false,passPressed=false;
  let aimDx=0,aimDy=0;

  if(K.KeyJ) dx-=1;

    if(Math.abs(rx)>0.18){aimDx=rx;}else if(Math.abs(ax)>0.15){aimDx=ax;}
    if(Math.abs(ry)>0.18){aimDy=ry;}else if(Math.abs(ay)>0.15){aimDy=ay;}
    // ── D-pad → move ──────────────────────────────────────────────────────
    if(g.buttons[12]?.pressed)dy-=1;   // D-up
    if(g.buttons[13]?.pressed)dy+=1;   // D-down
    if(g.buttons[14]?.pressed)dx-=1;   // D-left
    if(g.buttons[15]?.pressed)dx+=1;   // D-right
    // ── L2 / R2 → sprint ─────────────────────────────────────────────────
    sprint=!!((g.buttons[6]?.value??0)>0.25||(g.buttons[7]?.value??0)>0.25||  // L2 / R2
               g.buttons[4]?.pressed||g.buttons[5]?.pressed);                  // L1 / R1
    kickHeld=!!g.buttons[0]?.pressed;                   // × (Cross)
    const tb=!!g.buttons[1]?.pressed;                   // ○ (Circle) — tackle
    const sb=!!g.buttons[3]?.pressed;                   // △ (Triangle) — switch
    const pb=!!g.buttons[2]?.pressed;                   // □ (Square) — pass
    tacklePressed=tb&&!_p2PrevTackleBtn; _p2PrevTackleBtn=tb;
    swPressed   =sb&&!_p2PrevSwBtn;     _p2PrevSwBtn=sb;
    passPressed =pb&&!_p2PrevPassBtn;   _p2PrevPassBtn=pb;
  } else {
    tacklePressed=tacBtn&&!_p2PrevTackleBtn; _p2PrevTackleBtn=tacBtn;
    swPressed=swBtn&&!_p2PrevSwBtn;          _p2PrevSwBtn=swBtn;
    passPressed=pasKb&&!_p2PrevPassBtn;      _p2PrevPassBtn=pasKb;
  }
  const len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;}
  const aimActive=Math.hypot(aimDx,aimDy)>0.15;
  return{dx,dy,sprint,kickHeld,tacklePressed,swPressed,passPressed,aimDx,aimDy,aimActive};
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function nrm(x,y){const l=Math.hypot(x,y);return l>0?[x/l,y/l]:[1,0];}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
const particles=[];
function spawnDust(x,y,mvx,mvy,n=4){
  for(let i=0;i<n;i++){
    const a=Math.atan2(-mvy,-mvx)+(Math.random()-0.5)*1.5;
    const s=0.4+Math.random()*1.1;
    const l=50+Math.floor(Math.random()*18);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,life:0,max:16+Math.random()*12,r:1,col:`hsl(32,25%,${l}%)`});
  }
}
function spawnSparks(x,y,col='#fde047',n=8){
  const cols={kick:['#fde047','#fb923c','#fff'],green:['#22c55e','#4ade80','#fff'],orange:['#fb923c','#f97316','#fde047'],purple:['#a855f7','#c084fc','#fff']};
  const palette=cols[col]||[col];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:0,max:12+Math.random()*16,r:1.5,col:palette[Math.floor(Math.random()*palette.length)]});
  }
}
function spawnBounce(x,y,str){
  for(let i=0;i<Math.floor(str*2.5+1);i++){
    const a=-Math.PI/2+(Math.random()-0.5)*2;
    const col=weatherMode==='snow'?'#eef4ff':weatherMode==='rain'?'rgba(140,188,255,0.8)':(Math.random()<0.7?`hsl(${100+Math.random()*25},45%,${30+Math.random()*15}%)`:`hsl(32,25%,${45+Math.random()*15}%)`);
    particles.push({x,y,vx:Math.cos(a)*str*0.35,vy:Math.sin(a)*str*0.4,life:0,max:9+Math.random()*8,r:1,col});
  }
}
function spawnSplash(x,y){
  spawnRing(x,y,'rgba(120,180,255,0.65)',18,1.5);
  for(let i=0;i<5;i++){
    const a=-Math.PI*0.9+Math.random()*Math.PI*0.8;
    const s=0.9+Math.random()*2.0;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.6,life:0,max:8+Math.random()*7,r:1,col:'rgba(140,188,255,0.72)'});
  }
}
function updateParticles(dt){
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.09*dt;p.life+=dt;}
  particles.splice(0,particles.length,...particles.filter(p=>p.life<p.max));
}
function drawParticles(){
  for(const p of particles){
    cx.globalAlpha=Math.max(0,1-p.life/p.max)*0.9;
    cx.fillStyle=p.col;
    cx.fillRect(Math.round(p.x-p.r),Math.round(p.y-p.r),p.r*2,p.r*2);
  }
  cx.globalAlpha=1;
}

// ── CROWD & ATMOSPHERE ────────────────────────────────────────────────────────
let crowdMembers=[];

function buildCrowd(){
  crowdMembers=[];
  let si=0;
  const rnd=()=>{si++;return Math.abs(Math.sin(si*127.1+si*0.5)*43758.5453%1);};
  const addM=(x,y,team)=>crowdMembers.push({x,y,team,ph:rnd()*Math.PI*2,spd:0.7+rnd()*1.1});

  // Top stand (3 rows above pitch)
  for(let row=2;row<3;row++){            // rows 0-1 are behind the LED boards
    const y=PY-3-row*4; if(y<1)continue;
    for(let x=PX+2;x<PX+PW-2;x+=5)addM(x,y,x<MX?'home':'away');
  }
  // Bottom stand (3 rows below pitch)
  for(let row=2;row<3;row++){
    const y=PY+PH+3+row*4; if(y>LH-1)continue;
    for(let x=PX+2;x<PX+PW-2;x+=5)addM(x,y,x<MX?'home':'away');
  }
  // Left stand — skip goal mouth height range
  for(let row=0;row<3;row++){
    const x=PX-4-row*4; if(x<1)continue;
    for(let y=PY+4;y<PY+PH-4;y+=5){
      if(y>MY-GH/2-8&&y<MY+GH/2+8)continue; // gap for goal opening
      addM(x,y,'home');
    }
  }
  // Right stand
  for(let row=0;row<3;row++){
    const x=PX+PW+4+row*4; if(x>LW-1)continue;
    for(let y=PY+4;y<PY+PH-4;y+=5){
      if(y>MY-GH/2-8&&y<MY+GH/2+8)continue;
      addM(x,y,'away');
    }
  }

  // Top/bottom fabric banners were replaced by the LED boards (drawBoards)
}

function drawCrowd(){
  if(!crowdMembers.length)return;
  const t=Date.now()*0.002;
  const cel=(goalFlash||0)/90;

  cx.save();
  for(const c of crowdMembers){
    const bob=cel>0
      ? -Math.abs(Math.sin(t*c.spd*2.5+c.ph))*(2+cel*4)
      :  Math.sin(t*c.spd+c.ph)*1.1;
    const px=Math.round(c.x), py=Math.round(c.y+bob);
    const hue=c.team==='home'?142:0;
    const l=(28+Math.sin(c.ph*2.3)*13)|0;
    const s=(55+Math.sin(c.ph*1.7)*20)|0;
    cx.fillStyle=cel>0&&Math.sin(t*9+c.ph)>0.35?'#fff':`hsl(${hue},${s}%,${l}%)`;
    cx.fillRect(px-1,py-1,2,2); // head
    cx.fillStyle='rgba(0,0,0,0.22)';
    cx.fillRect(px-1,py+1,2,2); // body shadow
  }

  cx.restore();
}

function drawManagers(){
  if(!score)return;
  const t=Date.now()*0.003;
  const cel=goalFlash>0||phase==='end';
  _drawMgr(MX-110,PY+PH+7,'home',t,cel,score[0]);
  _drawMgr(MX+110,PY+PH+7,'away',t,cel,score[1]);
}

function _drawMgr(x,y,team,t,cel,pts){
  const shirt=COL[team].shirt;
  const skin=team==='home'?'#a06b3f':'#c8956c';
  const dy=cel?-Math.abs(Math.sin(t*7))*5:Math.sin(t*1.3)*0.8;
  const bx=Math.round(x), by=Math.round(y+dy);
  // head
  cx.fillStyle=skin;
  cx.beginPath();cx.arc(bx,by-9,3,0,Math.PI*2);cx.fill();
  // shirt body
  cx.fillStyle=shirt;
  cx.fillRect(bx-3,by-6,6,6);
  // arms — wave when celebrating
  const aw=cel?Math.abs(Math.sin(t*10))*4:1;
  cx.fillStyle=shirt;
  cx.fillRect(bx-6,by-5,2,(3+aw)|0);
  cx.fillRect(bx+4,by-5,2,(3+aw)|0);
  // legs
  cx.fillStyle='#1e293b';
  cx.fillRect(bx-3,by,2,4);
  cx.fillRect(bx+1,by,2,4);
  // small score badge
  cx.font='5px monospace';cx.textAlign='center';
  cx.fillStyle='rgba(255,255,255,0.5)';
  cx.fillText('MGR '+pts,bx,by+11);
}

// ── SKILL RINGS ───────────────────────────────────────────────────────────────
const rings=[];
function spawnRing(x,y,col,maxR=28,thick=1.5){
  rings.push({x,y,col,r:3,maxR,life:0,maxLife:22,thick});
}
function updateRings(dt){
  for(const r of rings){r.r+=(r.maxR-r.r)*0.20*dt;r.life+=dt;}
  rings.splice(0,rings.length,...rings.filter(r=>r.life<r.maxLife));
}
function drawRings(){
  for(const r of rings){
    const a=Math.max(0,1-r.life/r.maxLife);
    cx.globalAlpha=a*0.82;cx.strokeStyle=r.col;cx.lineWidth=r.thick;
    cx.beginPath();cx.arc(Math.round(r.x),Math.round(r.y+5),Math.max(1,r.r),0,Math.PI*2);cx.stroke();
  }
  cx.globalAlpha=1;
}

// ── SPEECH BUBBLES ────────────────────────────────────────────────────────────
const SPEECH={
  win:{
    3:['TOO EASY!','COLLECT AM!','EZ MONEY','W!','BANGER!','YOU SURE?','NAIJA NO DEY CARRY LAST'],
    2:['VAMOS!','OGA NA ME!','FIRE!','NA SO!','SHARP!'],

  },
  lose:{

    2:['WAHALA...','ABEG...','EHH...','NO BE ME'],
    1:['MY FAULT...','SORRY O','L...','NO VIBE'],
  },
};
function assignGoalBubbles(scoringTeam){
  const winners=scoringTeam==='home'?home:away;
  const losers =scoringTeam==='home'?away:home;
  for(const p of winners){
    const pool=SPEECH.win[p.ego]??SPEECH.win[2];
    p.speechBubble={text:pool[Math.floor(Math.random()*pool.length)],t:0,maxT:190};
  }
  for(const p of losers){
    const pool=SPEECH.lose[p.ego]??SPEECH.lose[2];
    p.speechBubble={text:pool[Math.floor(Math.random()*pool.length)],t:0,maxT:190};
  }
}

// ── CALLOUTS ──────────────────────────────────────────────────────────────────
const callouts=[];
function showCallout(text,x,y,dur){
  dur=dur??BALANCE.callout.defaultDuration;
  const ex=callouts.find(c=>c.text===text);
  if(ex){ex.t=0;ex.x=x;ex.y=y;return;}
  callouts.push({text,x,y,t:0,dur});
}
function updateCallouts(dt){
  for(const c of callouts)c.t+=dt;
  callouts.splice(0,callouts.length,...callouts.filter(c=>c.t<c.dur));
}
function drawCallouts(){
  const CO=BALANCE.callout;
  for(const c of callouts){
    const prog=c.t/c.dur;
    const sc2=c.t<CO.scaleInFrames?lerp(0,CO.peakScale,c.t/CO.scaleInFrames):lerp(CO.peakScale,1,Math.min((c.t-CO.scaleInFrames)/5,1));
    const alpha=prog>CO.scaleOutStart?1-(prog-CO.scaleOutStart)/(1-CO.scaleOutStart):1;
    const fy=c.y-c.t*CO.floatSpeed;
    cx.save();
    cx.globalAlpha=Math.max(0,alpha);
    cx.translate(Math.round(c.x),Math.round(fy));
    cx.scale(sc2,sc2);
    cx.font='bold 7px monospace';
    cx.textAlign='center';
    cx.strokeStyle='#000';cx.lineWidth=1.5;cx.lineJoin='round';
    cx.strokeText(c.text,0,0);
    cx.fillStyle='#b91c1c';cx.fillText(c.text,1,3);
    cx.fillStyle='#fde047';cx.fillText(c.text,0,0);
    cx.restore();
  }
}

// ── SPRITE ────────────────────────────────────────────────────────────────────
// Profile / side-view sprite — head offset toward facing direction
function dot(ox,oy,rx,ry,col){
  cx.fillStyle=col;
  cx.fillRect(ox+rx*SP,oy+ry*SP,SP,SP);
}

// 4-frame stride tables (multiply rx entries by dir)
// Front leg (in direction of travel), back leg (opposite)
const FL_X=[1,2,1,0];  // front leg x offset * dir
const BL_X=[-1,-2,-1,0]; // back leg x offset * dir
const FL_Y=[0,-1,0,1];  // front leg y (lift)
const BL_Y=[0,1,0,-1];  // back leg y

function drawPlayer(x,y,tc,frame,state,dir,alpha,tall=false){
  x=Math.round(x); y=Math.round(y);
  cx.globalAlpha=alpha??1;
  const d=dir;
  const bodyTop=tall?-5:-3;
  const headOff=tall?2:0;
  const gloveCol=tall?(tc.gloves??'#fff'):tc.skin;  // GK gloves vs bare hands

  cx.fillStyle='rgba(0,0,0,0.27)';
  cx.fillRect(x-3*SP,y+7*SP,7*SP,SP);

  if(state==='dive'){
    for(let rx=-4;rx<=3;rx++)dot(x,y,rx,-1,tc.shirt);
    dot(x,y,-5,-1,tc.shorts);dot(x,y,-6,-1,tc.shorts);dot(x,y,-7,0,'#111');
    dot(x,y,4,0,gloveCol);dot(x,y,5,0,gloveCol);dot(x,y,5,-1,gloveCol);  // outstretched gloves
    dot(x,y,-2,-3,tc.hair);dot(x,y,-3,-3,tc.hair);
    dot(x,y,-2,-2,tc.skin);dot(x,y,-3,-2,tc.skin);dot(x,y,-4,-2,tc.skin);
    cx.globalAlpha=1;return;
  }



  if(state==='kick'){
    for(let ry=bodyTop;ry<=0;ry++){dot(x,y,0,ry,tc.shirt);dot(x,y,-d,ry,tc.shirt);}
    dot(x,y,0,1,tc.shorts);
    dot(x,y,-d,2,tc.shorts);dot(x,y,-d,3,tc.shorts);dot(x,y,-d*2,4,'#111');
    dot(x,y,d,1,tc.shorts);dot(x,y,d*2,0,tc.shorts);dot(x,y,d*3,1,'#111');
    dot(x,y,-d*2,-2-headOff,gloveCol);dot(x,y,-d*2,-1-headOff,gloveCol);  // back arm
    dot(x,y,d*2,-3-headOff,gloveCol);                                       // front arm
    dot(x,y,d,-6-headOff,tc.hair);dot(x,y,d*2,-6-headOff,tc.hair);
    dot(x,y,d,-5-headOff,tc.skin);dot(x,y,d*2,-5-headOff,tc.skin);dot(x,y,d*3,-5-headOff,tc.skin);
    dot(x,y,d,-4-headOff,tc.skin);dot(x,y,d*2,-4-headOff,tc.skin);
    cx.globalAlpha=1;return;
  }

  if(state==='celebrate'){
    const bob=Math.round(Math.sin(Date.now()*0.007)*2);
    for(let ry=bodyTop;ry<=0;ry++){dot(x,y+bob,0,ry,tc.shirt);dot(x,y+bob,d,ry,tc.shirt);}
    dot(x,y+bob,0,1,tc.shorts);
    dot(x,y+bob,-d,2,tc.shorts);dot(x,y+bob,-d,3,tc.shorts);dot(x,y+bob,-d,4,'#111');
    dot(x,y+bob,d,2,tc.shorts);dot(x,y+bob,d,3,tc.shorts);dot(x,y+bob,d,4,'#111');
    dot(x,y+bob,-d*2,-4-headOff,gloveCol);dot(x,y+bob,-d*2,-3-headOff,gloveCol);  // left arm raised
    dot(x,y+bob,d*2,-4-headOff,gloveCol);dot(x,y+bob,d*2,-3-headOff,gloveCol);    // right arm raised
    dot(x,y+bob,d,-6-headOff,tc.hair);dot(x,y+bob,d*2,-6-headOff,tc.hair);
    dot(x,y+bob,d,-5-headOff,tc.skin);dot(x,y+bob,d*2,-5-headOff,tc.skin);dot(x,y+bob,d*3,-5-headOff,tc.skin);
    dot(x,y+bob,d,-4-headOff,tc.skin);dot(x,y+bob,d*2,-4-headOff,tc.skin);
    cx.globalAlpha=1;return;
  }

  // stride bob: body lifts on passing frames (shadow stays on the ground)
  if(state==='run'&&(frame===1||frame===3))y-=Math.round(SP);
  const flx=FL_X[frame]*d, fly=FL_Y[frame];
  const blx=BL_X[frame]*d, bly=BL_Y[frame];
  const armSwing=[0,1,0,-1][frame];

  dot(x,y,-d*2+armSwing*d,-2-headOff,gloveCol);dot(x,y,-d*2+armSwing*d,-1-headOff,gloveCol);  // back arm
  dot(x,y,blx,2+bly,tc.shorts);dot(x,y,blx,3+bly,tc.shorts);dot(x,y,blx-d,4+bly,'#111');
  for(let ry=bodyTop;ry<=0;ry++){dot(x,y,0,ry,tc.shirt);dot(x,y,-d,ry,tc.shirt);}
  dot(x,y,0,1,tc.shorts);
  dot(x,y,flx,2+fly,tc.shorts);dot(x,y,flx,3+fly,tc.shorts);dot(x,y,flx+d,4+fly,'#111');
  dot(x,y,d*2-armSwing*d,-2-headOff,gloveCol);dot(x,y,d*2-armSwing*d,-1-headOff,gloveCol);    // front arm
  dot(x,y,d,-6-headOff,tc.hair);dot(x,y,d*2,-6-headOff,tc.hair);
  dot(x,y,d,-5-headOff,tc.skin);dot(x,y,d*2,-5-headOff,tc.skin);dot(x,y,d*3,-5-headOff,tc.skin);
  dot(x,y,d,-4-headOff,tc.skin);dot(x,y,d*2,-4-headOff,tc.skin);
  cx.globalAlpha=1;
}

function drawBall(x,y,z,spin){
  x=Math.round(x);
  const by=Math.round(y-z);
  const ss=Math.max(0.3,1-z*0.017);
  cx.fillStyle=`rgba(0,0,0,${0.3*ss})`;
  cx.beginPath();cx.ellipse(x,y,(5+z*0.18)*ss,(2.5+z*0.07)*ss,0,0,Math.PI*2);cx.fill();
  // squash on bounce, stretch along travel when fast
  const sq=ball.squash||0, vsp=ball.owner?0:Math.hypot(ball.vx,ball.vy);
  const st=Math.min(0.35,Math.max(0,(vsp-3)*0.06)), ang=Math.atan2(ball.vy,ball.vx);
  cx.save();cx.translate(x,by+sq*BRAD*0.6);cx.scale(1+sq,1-sq);cx.rotate(ang);cx.scale(1+st,1-st*0.5);
  cx.fillStyle='#FFD700';cx.beginPath();cx.arc(0,0,BRAD,0,Math.PI*2);cx.fill();
  cx.rotate(spin-ang);
  cx.fillStyle='#7a4700';cx.fillRect(-1,-1,2,2);
  cx.fillStyle='#a86200';cx.fillRect(2,-1,1,1);cx.fillRect(-BRAD+1,0,1,1);
  cx.restore();
  cx.fillStyle='rgba(255,255,200,0.65)';cx.fillRect(x+1,by-3,1,1);
}

// ── PITCH ─────────────────────────────────────────────────────────────────────
function buildPitch(){
  const pc=document.createElement('canvas');pc.width=LW;pc.height=LH;
  const g=pc.getContext('2d');
  g.fillStyle='#1a1a2e';g.fillRect(0,0,LW,LH);
  for(let i=0;i<8;i++){
    g.fillStyle=i%2?'#368040':'#3a9148';
    g.fillRect(PX,PY+i*(PH/8),PW,Math.ceil(PH/8)+1);
  }
  g.strokeStyle='rgba(255,255,255,0.75)';g.lineWidth=1.5;
  g.strokeRect(PX,PY,PW,PH);
  g.beginPath();g.moveTo(MX,PY);g.lineTo(MX,PY+PH);g.stroke();
  g.beginPath();g.arc(MX,MY,PITCH.centreCircleR,0,Math.PI*2);g.stroke();
  g.fillStyle='rgba(255,255,255,0.9)';g.fillRect(MX-1,MY-1,3,3);
  const bxW=PITCH.penaltyBoxW,bxH=PITCH.penaltyBoxH;
  g.strokeRect(PX,MY-bxH/2,bxW,bxH);g.strokeRect(PX+PW-bxW,MY-bxH/2,bxW,bxH);
  g.strokeStyle='#fff';g.lineWidth=2;
  g.strokeRect(PX-GD,MY-GH/2,GD,GH);g.strokeRect(PX+PW,MY-GH/2,GD,GH);
  g.lineWidth=0.5;g.strokeStyle='rgba(255,255,255,0.12)';
  for(let ny=MY-GH/2;ny<MY+GH/2;ny+=7){
    g.beginPath();g.moveTo(PX-GD,ny);g.lineTo(PX,ny);g.stroke();
    g.beginPath();g.moveTo(PX+PW,ny);g.lineTo(PX+PW+GD,ny);g.stroke();
  }
  for(let nx=PX-GD;nx<=PX;nx+=7){g.beginPath();g.moveTo(nx,MY-GH/2);g.lineTo(nx,MY+GH/2);g.stroke();}
  for(let nx=PX+PW;nx<=PX+PW+GD;nx+=7){g.beginPath();g.moveTo(nx,MY-GH/2);g.lineTo(nx,MY+GH/2);g.stroke();}
  return pc;
}

const SKILL = Object.fromEntries(
  Object.entries(SKILLS).map(([k,s]) => [k, {
    label:  s.label,
    col:    s.color,

// ── PLAYER FACTORY ────────────────────────────────────────────────────────────
function mkPlayer(x,y,team,role,skills=[],name='',gkRating=1){
  const cds={}, starLevels={}, skillNames=[];
  for(const s of skills){
    const [sname,stars]=Array.isArray(s)?s:[s,1];
    skillNames.push(sname); cds[sname]=0; starLevels[sname]=stars;
  }
  const overallStars = skillNames.length>0 ? Math.max(...skillNames.map(s=>starLevels[s]??1)) : 0;
  // Ego: 1-3 based on role boldness + star level
  const roleBase=['st','lw','rw'].includes(role)?3:['cm','lcm','rcm'].includes(role)?2:1;
  const ego=Math.min(3,Math.max(1,Math.round(roleBase+(overallStars>0?(overallStars-2)*0.5:0))));
  return{
    x,y,vx:0,vy:0,team,role,name,overallStars,gkRating,ego,
    hx:x,hy:y,
    dir:team==='home'?1:-1,
    frame:0,frameT:0,state:'idle',
    kickCD:0,tackleCD:0,
    controlled:false,
    skills:skillNames,skillCDs:cds,starLevels,
    activeSkill:null,skillT:0,
    feinted:false,feintT:0,
    diving:false,
    stamina:100, missT:0,
    speechBubble:null,
    goalsScored:0,
    hatTrickMode:false,
  };
}

function buildTeamsFromDef(hDef,aDef){
  function resolve(def,teamId){
    const fx=teamId==='away'?-1:1;
    return def.formation.map(f=>{
      const x=MX+f.rx*fx*(PW/2);
      const y=MY+f.ry*(PH/2);
      return mkPlayer(x,y,teamId,f.role,f.skills,f.name??f.role,f.gkRating??1);
    });
  }
  return{h:resolve(hDef,'home'),a:resolve(aDef,'away')};
}

// ── COMMENTARY (AFRO MIKE + COACH BAYO, lines in commentary.js) ──────────────
let commentary=null;         // {who, text, t, maxT, reply?, replyAt?}
let commentaryCooldown=0;    // frames before the next event can be called
let lastKicker=null;         // last player to shoot — for goal attribution
let lastShotPower=false;     // true when last shot was a power shot
let prevGKOwner=null;        // track GK ball-ownership transitions (save detection)

// Show a line and play its voice clip (if generated). A reply from the other
// commentator follows once the first clip ends, or after a beat when text-only.
function sayLine(line,reply){
  commentary={who:line.who,text:line.text,t:0,maxT:200,reply,replyAt:reply?110:Infinity};
  const c=commentary;
  playVoice(line.id,()=>{ if(c===commentary&&c.reply)c.replyAt=c.t+12; });
}
function triggerCommentary(eventKey){
  if(commentaryCooldown>0)return;
  const pool=LINES[eventKey]; if(!pool)return;
  commentaryCooldown=260;
  const line=pool[Math.floor(Math.random()*pool.length)];
  sayLine(line,line.reply&&Math.random()<0.6?line.reply:null);
}
function tickCommentary(dt){
  if(commentaryCooldown>0)commentaryCooldown=Math.max(0,commentaryCooldown-dt);
  if(!commentary)return;
  commentary.t+=dt;
  if(commentary.reply&&commentary.t>=commentary.replyAt){sayLine(commentary.reply,null);return;}
  if(commentary.t>=commentary.maxT)commentary=null;
}

function drawCommentary(){
  if(!commentary)return;
  const{text,t,maxT,who}=commentary;
  const prog=t/maxT;
  const a=prog<0.08?prog/0.08:prog>0.78?1-(prog-0.78)/0.22:1;
  if(a<=0)return;
  cx.save();cx.globalAlpha=Math.max(0,a);
  cx.font='bold 8px monospace';
  const tag=COMMENTATORS[who].name+': ';
  const twTag=cx.measureText(tag).width;
  const twTxt=cx.measureText(text).width;
  const totalW=twTag+twTxt+18;
  const bh=14,bx2=MX-totalW/2,by2=PY+PH-36;
  cx.fillStyle='rgba(6,6,18,0.90)';cx.fillRect(bx2,by2,totalW,bh);
  cx.strokeStyle='rgba(253,224,71,0.45)';cx.lineWidth=0.8;cx.strokeRect(bx2,by2,totalW,bh);
  cx.textAlign='left';
  cx.fillStyle=COMMENTATORS[who].color;cx.fillText(tag,bx2+7,by2+10);
  cx.fillStyle='#ffffff';cx.fillText(text,bx2+7+twTag,by2+10);
  cx.restore();
}

// ── CPU TEST MODE ─────────────────────────────────────────────────────────────
let cpuTestMode=false;

function setCpuMode(on){ cpuTestMode=on; if(!on){home[ctrlIdx].controlled=true;} }

function setupKickoffPositions(){
  koTimer=0; koPassDone=false;
  if(cpuTestMode){ball.owner=null;return;}
  if(koTeam===0){
    koHolder=home[ctrlIdx];
    koPartner=home.find(p=>p!==koHolder&&(p.role==='cm'||p.role==='lcm'||p.role==='rcm'))
             ??home.find(p=>p!==koHolder&&p.role!=='gk');
    if(koHolder){koHolder.x=MX;koHolder.y=MY;}
    if(koPartner){koPartner.x=MX-20;koPartner.y=MY+10;}
    ball.owner=koHolder??null;
  } else {
    koHolder=away.find(p=>p.role==='st')??away.find(p=>p.role!=='gk')??away[0];
    koPartner=away.find(p=>p!==koHolder&&(p.role==='cm'||p.role==='lcm'||p.role==='rcm'))
             ??away.find(p=>p!==koHolder&&p.role!=='gk');
    if(koHolder){koHolder.x=MX;koHolder.y=MY;}
    if(koPartner){koPartner.x=MX+20;koPartner.y=MY+10;}
    ball.owner=koHolder??null;
  }
}

function initMatch(hDef=matchHomeDef,aDef=matchAwayDef){
  matchHomeDef=hDef; matchAwayDef=aDef;
  updateCOL(hDef,aDef);
  const teams=buildTeamsFromDef(hDef,aDef);
  home=teams.h; away=teams.a;
  ball=mkBall();
  resetPossession();
  resetFx();
  commentary=null; commentaryCooldown=0;
  triggerCommentary('kickoff');
  // Control the ST (or last outfield player if no ST)
  ctrlIdx=home.findIndex(p=>p.role==='st');
  if(ctrlIdx<0)ctrlIdx=home.length-1;
  if(!cpuTestMode)home[ctrlIdx].controlled=true;
  ctrlIdx2=away.findIndex(p=>p.role==='st');
  if(ctrlIdx2<0)ctrlIdx2=away.length-1;
  if(p2Mode)away[ctrlIdx2].controlled=true;
  score=[0,0]; timer=MATCH_S; phase='kickoff'; koTeam=0; goalFlash=0; paused=false;
  trails.length=0; particles.length=0; callouts.length=0;
  initWeather();
  buildCrowd();

}

function resetKO(scored){

// ── SWITCHING ────────────────────────────────────────────────────────────────
function switchBest(){
  home.forEach(p=>p.controlled=false);
  let bi=4,bd=Infinity;
  home.forEach((p,i)=>{
    if(p.role==='gk')return;
    const d=dst(p,ball);if(d<bd){bd=d;bi=i;}
  });
  ctrlIdx=bi; home[bi].controlled=true;
}
function switchTo(idx){
  if(idx<0||idx>=home.length)return;
  home.forEach(p=>p.controlled=false);
  ctrlIdx=idx; home[idx].controlled=true;
}
function switchBest2(){
  away.forEach(p=>p.controlled=false);
  let bi=0,bd=Infinity;
  away.forEach((p,i)=>{
    if(p.role==='gk')return;
    const d=dst(p,ball);if(d<bd){bd=d;bi=i;}
  });
  ctrlIdx2=bi; away[bi].controlled=true;
}
function switchTo2(idx){
  if(idx<0||idx>=away.length)return;
  away.forEach(p=>p.controlled=false);
  ctrlIdx2=idx; away[idx].controlled=true;
}

// ── SKILL ACTIVATION ─────────────────────────────────────────────────────────
function canSkill(p,name){
  const ST=BALANCE.stamina;
  return p.skills.includes(name)&&(p.skillCDs[name]??1)<=0&&!p.activeSkill&&p.stamina>=ST.minToActivate;
}
function activateSkill(p,name){
  const def=SKILL[name];
  const stars=p.starLevels?.[name]??1;
  const cdScale=1.5-0.25*stars;
  const starStr='★'.repeat(stars);
  p.activeSkill=name; p.skillT=def.dur;
  p.skillCDs[name]=Math.round(def.cd*cdScale);
  p.stamina=Math.max(0,p.stamina-(BALANCE.stamina.costs[name]??20));
  showCallout(def.label+' '+starStr,p.x,p.y-22);
  // Per-skill animation
  if(name==='powerShot'){
    spawnRing(p.x,p.y,def.col,44,3);spawnRing(p.x,p.y,def.col,22,1.5);
    spawnSparks(p.x,p.y,def.spkCol,16);
    slowMoTimer=BALANCE.slowMo.duration;    // ← trigger slow-motion
  } else if(name==='speedBoost'){
    spawnRing(p.x,p.y,def.col,26);spawnRing(p.x,p.y,def.col,13,1);
    spawnSparks(p.x,p.y,def.spkCol,9);
  } else if(name==='steal'){
    spawnRing(p.x,p.y,def.col,32);spawnRing(p.x,p.y,def.col,16,1);
    spawnSparks(p.x,p.y,def.spkCol,9);
  } else if(name==='longShot'){
    spawnRing(p.x,p.y,def.col,38);spawnRing(p.x,p.y,def.col,18,1);
    spawnSparks(p.x,p.y,def.spkCol,7);
  }
  if(name==='speedBoost'&&ball.owner===p){
    const FT=BALANCE.feint;
    const opps=p.team==='home'?away:home;
    for(const o of opps){if(dst(p,o)<FT.radius){o.feinted=true;o.feintT=FT.duration;}}
    rumbleCpuSkill();
    if(Math.random()<0.32)triggerCommentary('speedBoost');
  }
  // Chase-down flash steal — defender speedBoost near an opponent carrier
  const isDefR=p.role==='cb'||p.role==='lb'||p.role==='rb';
  if(name==='speedBoost'&&isDefR&&ball.owner&&ball.owner.team!==p.team){
    const carrier=ball.owner;
    const chaseRange=SKILLS.steal.tackleRange*(2.2+0.6*(p.starLevels?.steal??1));
    if(dst(p,carrier)<chaseRange&&canChallenge(p)&&rollTackle(p,carrier,BALANCE.duel.stealSkillBonus)){
      const[fnx,fny]=nrm(carrier.x-p.x,carrier.y-p.y);
      p.x=carrier.x-fnx*(PRAD*2.2); p.y=carrier.y-fny*(PRAD*2.2);
      ball.owner=null;
      ball.vx=(Math.random()-0.5)*3.5; ball.vy=(Math.random()-0.5)*3.5;
      p.tackleCD=POWER.ai.tackleCooldown;
      showCallout('FLASH STEAL! ⚡',p.x,p.y-26,70);
      spawnSparks(p.x,p.y,def.spkCol,16);
      spawnRing(p.x,p.y,def.col,44,3);
      rumbleTackle();
      triggerCommentary('flashSteal');
    }
  }
  if(name==='powerShot')triggerCommentary('powerShot');
  else if(name==='longShot')triggerCommentary('longShot');
}

// ── DUELS & POSSESSION ───────────────────────────────────────────────────────
// One tackle formula for human and CPU. possT counts frames since the ball
// last changed owner: it drives the new carrier's grace period and AI reaction.
let possT=0, prevOwner=null;
const teamChallengeT={home:0,away:0}, teamShotT={home:0,away:0};
function tickPossession(dt){
  const sp=Math.hypot(ball.vx,ball.vy);
  if(ball.owner||sp<BALANCE.pass.shieldEndSpeed)ball.shielded=false;
  if(ball.passTo){ball.passT+=dt;if(ball.owner||sp<0.3||ball.passT>BALANCE.pass.maxReceiveFrames)ball.passTo=null;}
  if(ball.owner!==prevOwner){prevOwner=ball.owner;possT=0;}
  else possT+=dt;
  for(const t of ['home','away']){
    teamChallengeT[t]=Math.max(0,teamChallengeT[t]-dt);
    teamShotT[t]=Math.max(0,teamShotT[t]-dt);
  }
}
function resetPossession(){
  possT=0;prevOwner=null;
  teamChallengeT.home=teamChallengeT.away=teamShotT.home=teamShotT.away=0;
}
const inGrace=()=>possT<BALANCE.duel.possessionGrace;
function rollTackle(p,carrier,bonus=0){
  const D=BALANCE.duel, ST=BALANCE.stamina;
  stampStreak(p.x,p.y+8,carrier.x,carrier.y+8);
  p.stamina=Math.max(0,p.stamina-ST.tackleCost);
  const tStars=p.starLevels?.steal??p.overallStars??1;
  let ch=D.baseChance+D.starBonus*(tStars-(carrier.overallStars??1))+bonus;
  if(carrier.stamina<ST.fatigueBelow)ch+=D.tiredCarrierBonus;
  if(p.stamina<ST.fatigueBelow)ch-=D.tiredTacklerPenalty;
  if(Math.random()<clamp(ch,D.min,D.max)){addShake(FX.tackleShake);return true;}
  p.tackleCD=D.missCooldown; p.missT=D.missSlowFrames;
  showCallout('MISSED!',p.x,p.y-22,30);
  return false;
}
function laneBlocked(p,goalX,opps){
  const L=BALANCE.cpu.laneCheckDist;
  const[gx,gy]=nrm(goalX-p.x,MY-p.y);
  return opps.some(o=>{
    if(o.role==='gk')return false;
    const ox=o.x-p.x,oy=o.y-p.y,d=Math.hypot(ox,oy);
    return d>0&&d<L&&(ox*gx+oy*gy)/d>0.85;
  });
}

// ── PASSING ──────────────────────────────────────────────────────────────────
// Pass speed is solved from the ball's rolling friction so it reaches the
// receiver with a controllable pace, and the receiver runs onto it.
function rollDecay(){
  const BP=PHYSICS.ball;
  const fm=weatherMode==='rain'?-BALANCE.weather.rain.frictionMod:weatherMode==='snow'?-BALANCE.weather.snow.frictionMod:0;
  return (BP.friction+fm)*BP.groundFriction;
}
function passSpeed(d){
  const P=BALANCE.pass;
  return clamp(P.arrivalSpeed+d*(1-rollDecay()),P.minSpeed,P.maxSpeed);
}
// Can any opponent reach a point on the pass line before the ball gets there?
function passLaneBlocked(p,m,opps){
  const P=BALANCE.pass, r=rollDecay();
  const dx=m.x-p.x,dy=m.y-p.y,L=Math.hypot(dx,dy)||1, v0=passSpeed(L);
  return opps.some(o=>{
    for(let t=0.15;t<0.95;t+=0.1){
      const px=p.x+dx*t,py=p.y+dy*t,along=L*t;
      // frames for the rolling ball to cover `along`: v0(1-r^n)/(1-r)=along
      const k=1-along*(1-r)/v0; if(k<=0)return true;
      const frames=Math.log(k)/Math.log(r);
      if(Math.hypot(px-o.x,py-o.y)-PRAD-BRAD<P.interceptSpeed*frames)return true;
    }
    return false;
  });
}
function makePass(p,m){
  const v=passSpeed(dst(p,m));
  const[bx,by]=nrm(m.x-p.x,m.y-p.y);
  ball.owner=null;
  ball.vx=bx*v; ball.vy=by*v; ball.z=1; ball.vz=0.3;
  ball.onFire=false; ball.isCurveShot=false; ball.bypassesKeeper=false; ball.shielded=false;
  ball.passTo=m; ball.passT=0;
}

// ── AI ACTIONS ────────────────────────────────────────────────────────────────
function aiShoot(p,goalX,power){
  const AI=POWER.ai;
  ball.owner=null; lastKicker=p;
  // Higher shot/longShot stars = tighter aim
  const shotStars=Math.max(p.starLevels?.powerShot??0,p.starLevels?.longShot??0);
  const accMult=shotStars>=3?0.38:shotStars>=2?0.68:1.0;
  const scatter=(Math.random()-0.5)*AI.normalScatter*(1-power/12)*accMult;
  const[bx,by]=nrm(goalX-p.x,MY+scatter-p.y);
  ball.vx=bx*power; ball.vy=by*power;
  ball.z=3; ball.vz=1.0;
  p.kickCD=AI.kickCooldown; p.state='kick';
  spawnSparks(p.x,p.y,'kick',5);
  if(power>AI.gkClearVelocity)teamShotT[p.team]=BALANCE.cpu.teamShotGap;
  if(devStats)devStats.shots[p.team==='home'?0:1]++;
}
function aiStrikerShoot(p,goalX){
  // Directional power shot — picks a goal corner, uses near-powerShot velocity
  const AI=POWER.ai, PS=SKILLS.powerShot;
  ball.owner=null; lastKicker=p;
  const sideSign=Math.random()<0.5?-1:1;
  const cornerY=MY+sideSign*(GH*0.28+Math.random()*GH*0.18);
  const shotStars=Math.max(p.starLevels?.powerShot??0,p.starLevels?.longShot??0);
  const accMult=shotStars>=3?0.18:shotStars>=2?0.42:0.70;
  const scatter=(Math.random()-0.5)*14*accMult;
  const[bx,by]=nrm(goalX-p.x,cornerY+scatter-p.y);
  const velMult = shotStars>=3 ? 1.0 : shotStars>=2 ? 0.5 : 0.3;
  const vel=PS.velocity*(0.82+Math.random()*0.22)*velMult;
  ball.vx=bx*vel; ball.vy=by*vel;
  ball.z=2.5+Math.random()*2.5; ball.vz=0.7+Math.random()*0.9;
  p.kickCD=AI.kickCooldown; p.state='kick';
  spawnSparks(p.x,p.y,'kick',8);
  teamShotT[p.team]=BALANCE.cpu.teamShotGap;
  if(devStats)devStats.shots[p.team==='home'?0:1]++;
}
function aiPass(p,mates){
  ball.owner=null;
  let best=null,bs=-Infinity;
  for(const m of mates){
    if(m===p)continue;
    const isLeft=p.team==='home';
    const fwd=isLeft?m.x-p.x:p.x-m.x;
    const s=fwd*0.6-dst(p,m)*0.08;
    if(s>bs){bs=s;best=m;}
  }
  const tgt=best??mates.find(m=>m!==p)??p;
  makePass(p,tgt);
  p.kickCD=10;
}
const canChallenge=p=>p.tackleCD<=0&&teamChallengeT[p.team]<=0&&!inGrace();
function aiTackle(p,bonus=0){
  if(!ball.owner||ball.owner.team===p.team)return;
  if(dst(p,ball.owner)<PRAD*3.2&&canChallenge(p)){
    teamChallengeT[p.team]=BALANCE.cpu.teamChallengeGap;
    if(!rollTackle(p,ball.owner,bonus))return;
    ball.owner=null;
    ball.vx=p.dir*1.8+(Math.random()-0.5);
    ball.vy=(Math.random()-0.5)*1.2;
    p.tackleCD=POWER.ai.tackleCooldown;
  }
}

// ── AI UPDATE ─────────────────────────────────────────────────────────────────
function aiUpdate(players,opps,dt){
  const isHome=players===home;
  const goalX =isHome?PX+PW+GD:PX-GD;
  const ownGoalX=isHome?PX-GD:PX+PW+GD;
  const gkX   =isHome?PX+5:PX+PW-5;
  const d2    =isHome?1:-1;
  const AI=POWER.ai, MV=MOVEMENT, GK=BALANCE.gk;
  const SB=SKILLS.speedBoost, STL=SKILLS.steal, PS=SKILLS.powerShot, LS=SKILLS.longShot;
  // Comeback aggression: boost when losing by 3+ goals
  const myScore=score[isHome?0:1], oppScore=score[isHome?1:0];
  const deficit=oppScore-myScore;
  const CPU=BALANCE.cpu;
  const comeback=CPU.comebackBoost&&deficit>=3;
  const comebackMult=comeback?Math.min(2.4,1+deficit*0.30):1.0;
  const pressBoost=comeback?1.35:1.0;

  for(const p of players){
    if(p.controlled)continue;

    // Feint debuff tick
    if(p.feintT>0){p.feintT-=dt;if(p.feintT<=0)p.feinted=false;}

    p.kickCD=Math.max(0,p.kickCD-dt);
    p.tackleCD=Math.max(0,p.tackleCD-dt);
    for(const s in p.skillCDs)p.skillCDs[s]=Math.max(0,p.skillCDs[s]-dt);
    if(p.skillT>0){p.skillT-=dt;}else if(p.activeSkill){p.activeSkill=null;}
    const ST=BALANCE.stamina;
    // Sustained drain while speedBoost is running; kill skill if stamina hits 0
    if(p.activeSkill==='speedBoost'){
      p.stamina=Math.max(0,p.stamina-ST.speedBoostDrainRate*dt);
      if(p.stamina<=0){p.activeSkill=null;p.skillT=0;}
    }
    if(p.missT>0)p.missT-=dt;

    const hasBall=ball.owner===p;
    const tmHas =players.some(m=>m===ball.owner);
    const opHas =opps.some(m=>m===ball.owner);
    // Speed: star-scaled speedBoost (★=0.9×  ★★=1.1×  ★★★=1.3× of base multiplier)
    const sbStars=p.starLevels?.speedBoost??1;
    const sbMult=p.activeSkill==='speedBoost'?SB.speedMultiplier*(0.7+0.2*sbStars):1;
    const fatigueMult=p.stamina<ST.fatigueBelow?ST.fatigueMult:1;
    const starSpd=p.overallStars>=3?1.18:p.overallStars>=2?1.07:1;
    const basSpd=WALK*sbMult*fatigueMult*starSpd;
    const spd   =p.feinted?basSpd*BALANCE.feint.speedMult:basSpd;
    let tx=p.hx, ty=p.hy;
    let reactionBoost=1; // set inside opHas press block for high-steal defenders
    const gkR=p.role==='gk'?(p.gkRating??1):0;
    const gkReachMult=gkR>=3?1.55:gkR>=2?1.25:1.0;

    if(p.role==='gk'){
      // ── GK DIVE SAVE (scaled by gkRating) ─────────────────────────────────
      const gkDiveThresh=GK.diveSpeedThresh*(gkR>=3?0.52:gkR>=2?0.74:1.0);
      // Distance-based react window: GK responds at same spatial range regardless of ball speed
      const gkReactDist=gkR>=3?PW*0.82:gkR>=2?PW*0.62:PW*0.48;
      p.diving=false;
      const ballFast=!ball.owner&&Math.abs(ball.vx)>gkDiveThresh;
      const headingIn=isHome?(ball.vx<0):(ball.vx>0);
      let didDive=false;
      if(ballFast&&headingIn&&ball.z<GK.goalMouthInset+18){
        const distToLine=Math.abs(gkX-ball.x);
        if(distToLine>0&&distToLine<gkReactDist){
          const tFrames=distToLine/Math.abs(ball.vx);
          const predY=ball.y+ball.vy*tFrames;
          const diveMargin=GH*0.55;
          if(predY<MY-GH/2-diveMargin||predY>MY+GH/2+diveMargin) { /* shot is wide — don't dive */ }
          else {
          const clampedY=clamp(predY,MY-GH/2+GK.goalMouthInset,MY+GH/2-GK.goalMouthInset);
          tx=gkX; ty=clampedY;
          p.diving=true; p.state='dive'; didDive=true;
          
          // Speed dive block - add an initial burst towards the ball
          p.x += (tx - p.x) * 0.4;
          p.y += (ty - p.y) * 0.4;

          if(gkR>=3&&Math.random()<0.55)showCallout('DIVING SAVE! 🤸',p.x,p.y-28,60);
          }
        }
      }
      if(!didDive){
        const distToGoalX = Math.abs(ball.x - gkX);

        // Step out to cut angles when ball gets close, but never step out past the ball
        let stepOut = 0;
        if (distToGoalX < 140) {
           stepOut = 25 * (1 - distToGoalX / 140);
           stepOut = Math.min(stepOut, distToGoalX * 0.75);
        }
        tx = isHome ? gkX + stepOut : gkX - stepOut;

        // Position Y to intersect the shot angle and track the ball
        let tyTarget = ball.y;
        if (distToGoalX > 5) {
            const ratio = stepOut / distToGoalX;
            tyTarget = MY + (ball.y - MY) * ratio;
        }
        tyTarget = (tyTarget + ball.y) * 0.5;

        ty=clamp(tyTarget, MY-GH/2+GK.goalMouthInset, MY+GH/2-GK.goalMouthInset);
      }
      if(hasBall){
        if(gkR>=2){
          // Controlled rebound — punch wide toward open space
          const wideY=ball.y<MY?PY+PH*0.2:PY+PH*0.8;
          const midX=isHome?MX-PW*0.22:MX+PW*0.22;
          const[cbx,cby]=nrm(midX-ball.x,wideY-ball.y);
          const clrSpd=AI.gkClearVelocity*(gkR>=3?2.4:1.7);
          ball.vx=cbx*clrSpd; ball.vy=cby*clrSpd;
          ball.vz=1.8; ball.owner=null; lastKicker=p;
          p.kickCD=AI.kickCooldown; p.state='kick';
          spawnSparks(p.x,p.y,'kick',4);
          const rebLbl=gkR>=3?'KEEPER LAUNCH! 🚀':'REBOUND CLEAR! 🥊';
          showCallout(rebLbl,p.x,p.y-28,60);
          p.speechBubble={text:gkR>=3?'MINE!!!':'OUT!!!',t:0,maxT:120};
        } else {
          aiShoot(p,goalX,AI.gkClearVelocity);
        }
        continue;
      }

    } else if(hasBall){
      const isAtk=p.role==='st'||p.role==='lw'||p.role==='rw';
      const isDef=p.role==='cb'||p.role==='lb'||p.role==='rb';
      const isMid=p.role==='cm'||p.role==='lcm'||p.role==='rcm';
      const shootMult=isAtk?2:isDef?0.15:1;
      const passMult =isDef?2.5:isMid?1.5:isAtk?0.6:1;
      // Defenders dribble toward midfield; attackers/mids push to goal
      tx=isDef?(isHome?MX-20:MX+20):goalX; ty=MY+(p.hy-MY)*0.25;
      const starSkill=p.overallStars>=3?2.4:p.overallStars>=2?1.4:1;
      const starRange=p.overallStars>=3?1.45:p.overallStars>=2?1.18:1;
      if(canSkill(p,'speedBoost')&&Math.random()<SB.dribbleActivateChance*starSkill*dt)activateSkill(p,'speedBoost');
      const psStars=p.starLevels?.powerShot??0;
      const psThresh=psStars>=3&&isAtk?CPU.starStrikerPowerShotChance*dt:PS.activateChance*starSkill*comebackMult*dt;
      const shotReady=p.kickCD<=0&&teamShotT[p.team]<=0;
      const laneMult=laneBlocked(p,goalX,opps)?CPU.blockedLaneMult:1;
      // Shoot BEFORE crossing into the penalty area (20px buffer outside the 18; 3★ wider)
      const boxPad=p.overallStars>=3?45:20;
      const nearBox=isHome
        ?(p.x>PX+PW-PBW-boxPad&&Math.abs(p.y-MY)<PBH/2+boxPad*0.6)
        :(p.x<PX+PBW+boxPad&&Math.abs(p.y-MY)<PBH/2+boxPad*0.6);
      // Fireball hot-zones for 3★ strikers: top-of-box centre, wide flanks, long-range centre
      const _dg=Math.abs(p.x-goalX), _dy=Math.abs(p.y-MY);
      const inFlameZone=psStars>=3&&isAtk&&(
        (_dg>=108&&_dg<=188&&_dy<72)   ||   // top of box — central
        (_dg>=72 &&_dg<=168&&_dy>=68&&_dy<=148) ||   // wide left / right angles
        (_dg>=188&&_dg<=275&&_dy<52)         // long-range central rocket
      );
      // In shooting position: shoot at a per-frame rate (not instantly), less when the lane is blocked
      if((nearBox||inFlameZone)&&shotReady&&Math.random()<CPU.boxShootChance*laneMult*dt){
        const psPick=psStars>=3&&isAtk?0.75:0.35;
        if(canSkill(p,'powerShot')&&Math.random()<psPick){
          activateSkill(p,'powerShot');
          const velMult=psStars>=3?1.0:psStars>=2?0.5:0.3;
          aiShoot(p,goalX,PS.velocity*velMult);
          lastShotPower=true;
          if (psStars >= 3 && Math.random() < CPU.fireballChance) {
              ball.onFire = true; ball.vx *= 1.35; ball.vy *= 1.35;
              ball.bypassesKeeper = true;
              showCallout('FIREBALL! 🔥', p.x, p.y-28); addShake(FX.fireballShake);
          } else {
              ball.onFire = false;
              ball.bypassesKeeper = false;
          }
        } else if(!(psStars>=3&&isAtk&&canSkill(p,'powerShot'))&&(!isDef||deficit>=3)){
          lastShotPower=false;
          if(isAtk&&Math.random()<0.9)aiStrikerShoot(p,goalX);
          else aiShoot(p,goalX,AI.normalVelocity+Math.random()*AI.normalVariance);
        } else if(isDef&&!(psStars>=3&&isAtk)){
          aiPass(p,players);  // defenders lay it off instead of shooting
        }
        tx=p.x; ty=p.y;
      } else {
        const dg=Math.abs(p.x-goalX);
        const effectiveRange=AI.shootRange*starRange;
        if(dg<effectiveRange&&shotReady){
          if(canSkill(p,'powerShot')&&dg<PS.goalRange*starRange&&Math.random()<psThresh){
            activateSkill(p,'powerShot');
            const velMult=psStars>=3?1.0:psStars>=2?0.5:0.3;
            aiShoot(p,goalX,PS.velocity*velMult);
            lastShotPower=true;
            if (psStars >= 3 && Math.random() < CPU.fireballChance) {
                ball.onFire = true; ball.vx *= 1.35; ball.vy *= 1.35;
                ball.bypassesKeeper = true;
                showCallout('FIREBALL! 🔥', p.x, p.y-28); addShake(FX.fireballShake); addShake(FX.fireballShake);
            } else {
                ball.onFire = false;
                ball.bypassesKeeper = false;
            }
          } else if(!(psStars>=3&&isAtk&&canSkill(p,'powerShot'))&&canSkill(p,'longShot')&&dg<LS.maxRange*starRange&&dg>LS.minRange&&Math.random()<LS.activateChance*starSkill*comebackMult*dt){
            lastShotPower=false;
            activateSkill(p,'longShot');
            const lsStars=p.starLevels?.longShot??1;
            const velMult=lsStars>=3?1.0:lsStars>=2?0.5:0.3;
            aiShoot(p,goalX,LS.velocity*velMult);
          } else if(!(psStars>=3&&isAtk&&canSkill(p,'powerShot'))&&dg<PS.goalRange*starRange&&Math.random()<AI.normalShootChance*shootMult*(p.ego>=3?1.28:1)*starSkill*comebackMult*laneMult*dt){
            lastShotPower=false;
            if(isAtk&&Math.random()<0.9)aiStrikerShoot(p,goalX);
            else aiShoot(p,goalX,AI.normalVelocity+Math.random()*AI.normalVariance);
          }
        }
      }
      // Defenders pass proactively; 3★ attackers resist pressure longer
      const pressurePassMult=p.overallStars>=3?0.42:1;
      if(isDef&&p.kickCD<=0&&Math.random()<AI.passChance*2*comebackMult*dt)aiPass(p,players);
      if(opps.some(o=>dst(o,p)<AI.passPressureRange)&&Math.random()<AI.passChance*passMult*pressurePassMult*comebackMult*dt)aiPass(p,players);

    } else if(tmHas){
      // ── SUPPORT RUNS — players open up for passes ──────────────────────────
      const carrier=ball.owner;
      if(p.role==='st'){
        const runDepth=MV.aiStrikerRunOffset*(p.overallStars>=3?2.2:p.overallStars>=2?1.4:1);
        tx=clamp(p.hx+d2*runDepth,PX+PRAD,PX+PW-PRAD); ty=p.hy;
      } else if(p.role==='lw'||p.role==='rw'){
        // Run forward in wide channel when carrier is in opposition half
        const inFinalThird=carrier&&(isHome?carrier.x>MX+PW*0.08:carrier.x<MX-PW*0.08);
        tx=inFinalThird?clamp(p.hx+d2*55,PX+PRAD,PX+PW-PRAD):p.hx;
        ty=p.hy;
      } else if(p.role==='lcm'||p.role==='rcm'){
        // Spread into passing triangle — offset sideways from carrier y
        const cY=carrier?carrier.y:MY;
        const side=p.role==='lcm'?-1:1;
        ty=clamp(MY+side*55+(cY-MY)*0.18,PY+PRAD,PY+PH-PRAD);
        tx=carrier?clamp(carrier.x+d2*28,PX+PRAD,PX+PW-PRAD):p.hx;
      } else if(p.role==='cm'){
        tx=carrier?clamp((p.hx+carrier.x)*0.5,PX+PRAD,PX+PW-PRAD):p.hx;
        ty=p.hy+(ball.y-MY)*0.12;
      } else if(p.role==='lb'||p.role==='rb'){
        const safeToOverlap=!opHas;
        if(safeToOverlap)tx=clamp(p.hx+d2*35,PX+PRAD,PX+PW-PRAD);
        ty=p.hy;
      } else{tx=p.hx;ty=p.hy;}

    } else if(opHas){
      const r=MV.aiPressRadius[p.role]??95;
      const effectiveR=r*(p.overallStars>=3?1.45:p.overallStars>=2?1.18:1)*pressBoost;
      const isDefRole=p.role==='cb'||p.role==='lb'||p.role==='rb';
      const stlStars=p.starLevels?.steal??1;
      // Defensive half: ball is anywhere on our side of the pitch
      const inDefHalf=isHome?ball.x<MX+50:ball.x>MX-50;
      // Danger zone: last ~28% of pitch toward own goal — all defenders converge
      const inDangerZone=isHome?ball.x<PX+PW*0.28:ball.x>PX+PW*0.72;
      // Near touchline: top or bottom 20% of pitch height
      const nearTouch=ball.y<PY+PH*0.20||ball.y>PY+PH*0.80;
      const defs = players.filter(m=>m.role==='cb'||m.role==='lb'||m.role==='rb');
      const closestDef = defs.length ? defs.reduce((a,b)=>dst(a,ball)<dst(b,ball)?a:b) : null;
      const isClosestDef = p === closestDef;

      // Proximity override: fullback has ball between them and the touchline
      let touchlineProximity = false;
      if (p.role === 'lb' && ball.y < p.y) touchlineProximity = true;
      if (p.role === 'rb' && ball.y > p.y) touchlineProximity = true;

      const proximityOverride = isDefRole && (dst(p,ball) < PRAD * 8 || (touchlineProximity && dst(p,ball) < effectiveR * 1.5));
      const canPress = (!isDefRole && dst(p,ball)<effectiveR) || (isDefRole && isClosestDef && dst(p,ball)<effectiveR) || proximityOverride;

      // 3-star steal CB presses anywhere on the pitch (100% aggressive)
      const zonePress=isDefRole&&(inDangerZone||(inDefHalf&&nearTouch)||(stlStars>=3&&isClosestDef));

      const reacted=possT>=BALANCE.cpu.reactionDelay;
      if(!p.feinted&&reacted&&(canPress||zonePress)){
        tx=ball.x;ty=ball.y;
        reactionBoost=stlStars>=3?1.68:stlStars>=2?1.16:1.0;
        if(canSkill(p,'speedBoost')&&dst(p,ball)<SB.defendActivateRange&&Math.random()<SB.defendActivateChance*dt)activateSkill(p,'speedBoost');
        const stlRange=STL.tackleRange*(stlStars>=3?1.85:0.7+0.18*stlStars);
        if(canSkill(p,'steal')&&ball.owner&&dst(p,ball.owner)<stlRange&&canChallenge(p)){
          activateSkill(p,'steal'); aiTackle(p,BALANCE.duel.stealSkillBonus);
        } else aiTackle(p);
      } else {
        // Out of press range — defenders maintain their formation Y with a moderate shift towards ball
        tx=p.hx;
        ty=isDefRole&&inDefHalf
          ? p.hy + (ball.y - p.hy) * 0.35
          : p.hy + (ball.y - MY) * 0.10;
        if(p.feinted){tx+=Math.random()<0.5?-8:8;}
      }

    } else {
      // No one has ball — the intended pass receiver runs onto it, else nearest outfield player chases
      const rcv=ball.passTo&&players.includes(ball.passTo)?ball.passTo:null;
      if(rcv){
        if(p===rcv){
          // meet the ball on its line: aim a little ahead of the ball along its path
          const sp=Math.hypot(ball.vx,ball.vy);
          const lead=Math.min(dst(p,ball)*0.5,sp*12);
          const[ux,uy]=sp>0.1?nrm(ball.vx,ball.vy):[0,0];
          tx=ball.x+ux*lead; ty=ball.y+uy*lead;
        }
      } else {
        const nearest=[...players].filter(m=>m.role!=='gk').sort((a,b)=>dst(a,ball)-dst(b,ball))[0];
        if(nearest===p){tx=ball.x;ty=ball.y;}
      }
    }

    const ddx=tx-p.x,ddy=ty-p.y,dd=Math.hypot(ddx,ddy);
    const diveBoost=p.diving?gkReachMult:1;
    // Chasing (far-target or press boost) is the AI's sprint: costs stamina, capped below human sprint
    const chaseMult=p.stamina>0?(dd>MV.aiFarDist?MV.aiFarMult:1)*reactionBoost:1;
    const chasing=dd>MV.aiArrivalDist&&chaseMult>1&&p.role!=='gk';
    if(chasing)p.stamina=Math.max(0,p.stamina-ST.chaseDrain*dt);
    else p.stamina=Math.min(ST.max,p.stamina+ST.regenPerFrame*dt);
    if(dd>MV.aiArrivalDist){
      let v=spd*chaseMult*diveBoost*(p.missT>0?BALANCE.duel.missSlowMult:1);
      if(p.activeSkill!=='speedBoost'&&!p.diving)v=Math.min(v,CPU.maxChaseSpeed);
      const s2=v*dt;
      p.x+=ddx/dd*s2; p.y+=ddy/dd*s2;
      if(!p.diving){p.state='run'; p.dir=ddx>0?1:-1;}
      if(weatherMode==='rain'&&Math.random()<0.012*dt)spawnSplash(p.x+(Math.random()-0.5)*4,p.y+5);
    } else if(!p.diving) p.state='idle';

    if (p.hatTrickMode && p.state === 'run' && Math.random() < 0.4) {
        spawnSparks(p.x, p.y + 5, 'orange', 2);
    }

    p.x=clamp(p.x,PX+PRAD,PX+PW-PRAD);
    p.y=clamp(p.y,PY+PRAD,PY+PH-PRAD);
    p.frameT+=dt*16.67;
    const frate=p.activeSkill==='speedBoost'?MV.aiSpeedBoostFrame:MV.aiFrameRate;
    if(p.frameT>=frate&&p.state==='run'){p.frame=(p.frame+1)%4;p.frameT=0;}
    else if(p.state==='idle')p.frame=0;
    
    const isGK = p.role === 'gk';
    const pickupR = isGK && p.diving ? 28 : (isGK ? 18 : PRAD+BRAD+PHYSICS.ball.pickupRadius+(ball.passTo===p?BALANCE.pass.receiveBonus:0));
    const maxZ = isGK ? 30 : PHYSICS.ball.maxPickupZ;

    let canCatch = !ball.bypassesKeeper && !(ball.shielded && !isGK);
    if(ball.bypassesKeeper && isGK && lastKicker) {
        const gkStars = p.gkRating ?? p.overallStars ?? 1;
        const kickerStars = lastKicker.overallStars ?? 1;
        if(gkStars > kickerStars && Math.random() < 0.5) {
            canCatch = true;
            ball.bypassesKeeper = false;
            showCallout('CLUTCH SAVE! 🧤', p.x, p.y-28);
        }
    }

    if(!ball.owner&&p.kickCD<=0&&dst(p,ball)<pickupR&&ball.z<maxZ&&canCatch){
        ball.owner=p;
        if(isGK) {
            p.diving=false; p.state='idle';
            if(Math.abs(ball.vx)>2) {
                showCallout('SUPER CATCH! 🧤', p.x, p.y-28, 60);
            }
        }
    }
  }
}

// ── WEATHER PHYSICS TICK ──────────────────────────────────────────────────────
function updateWeather(dt){
  weatherTimer+=dt;
  if(weatherTimer>=BALANCE.weather.cycleDuration){
    weatherTimer=0;
    weatherMode=weatherMode==='rain'?'snow':'rain'; weatherFade=0;
    if(weatherMode==='rain'){initRainStreaks();snowPiles.length=0;}
    else initSnowFlakes();
  }
  weatherFade=Math.min(1,weatherFade+dt/FX.weatherFadeFrames);
  updatePuddles(dt);
  if(weatherMode==='snow'){
    const S=BALANCE.weather.snow;
    if(snowPiles.length<S.pileMaxCount&&Math.random()<S.pileSpawnRate*dt)
      snowPiles.push({x:PX+PRAD+Math.random()*(PW-PRAD*2),y:PY+PRAD+Math.random()*(PH-PRAD*2),r:2,maxR:8+Math.random()*18});
    for(const sp of snowPiles)if(sp.r<sp.maxR)sp.r+=S.pileGrowRate*dt;
  }
}

// ── BALL PHYSICS ─────────────────────────────────────────────────────────────
function updateBall(dt){
  if(ball.owner){
    const p=ball.owner;
    ball.x=p.x+p.dir*6; ball.y=p.y+2;
    if (p.state === 'run') {
      ball.z = Math.abs(Math.sin(Date.now() * 0.015)) * 0.8;
    } else {
      ball.z = 0;
    }
    ball.spin+=p.dir*PHYSICS.ball.ownedSpinRate*dt;
    return;
  }
  if(ball.onFire && Math.random() < 0.8) spawnSparks(ball.x, ball.y, 'orange', 1);
  if(ball.isCurveShot && Math.random() < 0.9) spawnSparks(ball.x, ball.y, '#3b82f6', 2);
  
  if(ball.isCurveShot) {
      ball.vy += ball.curveForce * dt;
      ball.curveForce *= Math.pow(0.96, dt); // fade out curve force
  }

  const BP=PHYSICS.ball;
  // Weather mods
  if(weatherMode==='wind'){ball.vx+=windX*dt;ball.vy+=windY*dt;}
  const frictionMod=weatherMode==='rain'?-BALANCE.weather.rain.frictionMod:
                    weatherMode==='snow'?-BALANCE.weather.snow.frictionMod:0;
  const bounceMod  =weatherMode==='rain'? BALANCE.weather.rain.bounceMod:
                    weatherMode==='snow'? BALANCE.weather.snow.bounceMod:0;
  const bpx=ball.x,bpy=ball.y;
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  ball.z+=ball.vz*dt; ball.vz-=BP.gravity*dt;
  ball.spin+=ball.vx*BP.spinRate*dt;
  const eff=Math.pow(BP.friction+frictionMod,dt);
  ball.vx*=eff; ball.vy*=eff;
  // Extra rolling resistance when ball is on the ground
  if(ball.z<0.5){const gf=Math.pow(BP.groundFriction,dt);ball.vx*=gf;ball.vy*=gf;}

  // Puddles: the rolling ball splashes and drags through them
  if(ball.z<0.5&&puddles.length){
    const sp=Math.hypot(ball.vx,ball.vy);
    if(sp>0.6&&puddleAt(ball.x,ball.y)){
      const k=Math.pow(0.965,dt); ball.vx*=k; ball.vy*=k;
      if(Math.random()<0.25*dt)spawnSplash(ball.x,ball.y);
    }
  }
  if(ball.z<0){
    ball.z=0;
    const b=Math.abs(ball.vz);
    if(b>BP.minBounceSpeed){ball.vz=-b*(BP.groundBounceCoeff+bounceMod);ball.squash=Math.min(0.45,b*0.2);spawnBounce(ball.x,ball.y,b);if(weatherMode==='rain'&&b>0.5)spawnSplash(ball.x,ball.y);if(b>1.6)rumbleBounce();}
    else ball.vz=0;
  }

  // Sweep goal detection: use previous-frame position to interpolate y at goal line crossing
  if(phase==='play'){
    if(ball.x<PX&&bpx>=PX){
      const t=(PX-bpx)/(ball.x-bpx),cy=bpy+t*(ball.y-bpy);
      if(cy>MY-GH/2&&cy<MY+GH/2){goalScore(1);return;}
    }
    if(ball.x>PX+PW&&bpx<=PX+PW){
      const t=(PX+PW-bpx)/(ball.x-bpx),cy=bpy+t*(ball.y-bpy);
      if(cy>MY-GH/2&&cy<MY+GH/2){goalScore(0);return;}
    }
  }
  const inMouth=ball.y>MY-GH/2&&ball.y<MY+GH/2;
  if(inMouth){
    if(ball.x<PX&&phase==='play'){goalScore(1);return;}
    if(ball.x>PX+PW&&phase==='play'){goalScore(0);return;}
    if(ball.x<PX-GD){ball.x=PX-GD;ball.vx=Math.abs(ball.vx)*BP.goalpostBounceCoeff;}
    if(ball.x>PX+PW+GD){ball.x=PX+PW+GD;ball.vx=-Math.abs(ball.vx)*BP.goalpostBounceCoeff;}
    // Post collision — bounce off top/bottom of goal mouth inside net
    if(ball.x<PX||ball.x>PX+PW){
      if(ball.y<MY-GH/2+BRAD){ball.y=MY-GH/2+BRAD;ball.vy=Math.abs(ball.vy)*BP.goalpostBounceCoeff;}
      if(ball.y>MY+GH/2-BRAD){ball.y=MY+GH/2-BRAD;ball.vy=-Math.abs(ball.vy)*BP.goalpostBounceCoeff;}
    }
  } else {
    if(ball.x<PX+BRAD){ball.x=PX+BRAD;ball.vx=Math.abs(ball.vx)*BP.wallBounceCoeff;spawnBounce(ball.x,ball.y,2);rumbleWall();sndBallHit(Math.hypot(ball.vx,ball.vy));}
    if(ball.x>PX+PW-BRAD){ball.x=PX+PW-BRAD;ball.vx=-Math.abs(ball.vx)*BP.wallBounceCoeff;spawnBounce(ball.x,ball.y,2);rumbleWall();sndBallHit(Math.hypot(ball.vx,ball.vy));}
    // Near-miss detection: fast ball just passed a goal line at post height
    if(phase==='play'){
      const NM=BALANCE.goalProximity.nearMissRange;
      const topPost=MY-GH/2, botPost=MY+GH/2;
      const nearLeft =ball.x<PX+16&&Math.abs(ball.vx)>2;
      const nearRight=ball.x>PX+PW-16&&Math.abs(ball.vx)>2;
      if(nearLeft||nearRight){
        const distToMouth=Math.min(Math.abs(ball.y-topPost),Math.abs(ball.y-botPost));
        if(distToMouth<NM){showCallout('SO CLOSE! 😬',ball.x,ball.y-24,60);triggerCommentary('nearMiss');crowdReact('crowd-shocked');}
      }
    }
  }
  if(ball.y<PY+BRAD){
    ball.y=PY+BRAD;ball.vy=Math.abs(ball.vy)*BP.wallBounceCoeff;spawnBounce(ball.x,ball.y,2);rumbleWall();sndBallHit(Math.hypot(ball.vx,ball.vy));
    // Wide shot: high-speed hit near goal line = mini explosion
    if((ball.x<PX+50||ball.x>PX+PW-50)&&Math.hypot(ball.vx,ball.vy)>2.8){
      spawnSparks(ball.x,ball.y,'orange',11);spawnRing(ball.x,ball.y,'#fb923c',26,2.5);
    }
  }
  if(ball.y>PY+PH-BRAD){
    ball.y=PY+PH-BRAD;ball.vy=-Math.abs(ball.vy)*BP.wallBounceCoeff;spawnBounce(ball.x,ball.y,2);rumbleWall();sndBallHit(Math.hypot(ball.vx,ball.vy));
    if((ball.x<PX+50||ball.x>PX+PW-50)&&Math.hypot(ball.vx,ball.vy)>2.8){
      spawnSparks(ball.x,ball.y,'orange',11);spawnRing(ball.x,ball.y,'#fb923c',26,2.5);
    }
  }
}

function goalScore(team){
  if(phase!=='play')return;
  score[team]++;
  phase='goal'; goalFlash=90;
  ball.vx*=0.28; ball.vy=(Math.random()-0.5)*2.2; ball.vz=2.2+Math.random()*1.8;
  startGoalFx(team);
  crowdReact(team===0?'crowd-cheer':'crowd-angry');   // the stadium is mostly home fans
  spawnSparks(ball.x,ball.y,'kick',22);
  rumbleGoal();
  if(lastShotPower) sndNetBoom(); else sndGoal();
  lastShotPower=false;
  assignGoalBubbles(team===0?'home':'away');
  // Scorer celebration emote — override generic win bubble
  if(lastKicker){
    lastKicker.goalsScored = (lastKicker.goalsScored || 0) + 1;
    if (lastKicker.goalsScored === 3) {
      lastKicker.hatTrickMode = true;
      lastKicker.overallStars = 3;
      for (const s of lastKicker.skills) lastKicker.starLevels[s] = 3;
      showCallout('HAT TRICK MODE! 🔥🔥🔥', MX, MY-60, 180);
      lastKicker.speechBubble={text:'UNSTOPPABLE!',t:0,maxT:280};
    } else {
      const CEL=['🎉 GET IN!','🔥 FIRE GOAL!','⚽ YESSS!','💥 SENT IT!','🤩 NAIJA!!!','😤 TOO EASY!','🙌 BANGER!'];
      lastKicker.speechBubble={text:CEL[Math.floor(Math.random()*CEL.length)],t:0,maxT:280};
    }
  }
  triggerCommentary('goal');
  setTimeout(()=>resetKO(team), RULES.goalResetDelay);
}

// ── CONTROLLED PLAYER ─────────────────────────────────────────────────────────
function mkCtrl(){return{kickState:'idle',kickCharge:0,prevKickHeld:false,sprintTime:0,dirChanges:0,lastDir:1,dirChangeT:0};}
const ctrl1=mkCtrl(), ctrl2=mkCtrl();

function updateControlled(p,inp,dt,cs=ctrl1){
  p.kickCD=Math.max(0,p.kickCD-dt);
  p.tackleCD=Math.max(0,p.tackleCD-dt);
  const ST=BALANCE.stamina;
  if(p.missT>0)p.missT-=dt;
  if(p.activeSkill==='speedBoost'){
    p.stamina=Math.max(0,p.stamina-ST.speedBoostDrainRate*dt);
    if(p.stamina<=0){p.activeSkill=null;p.skillT=0;}
  }
  const fatigueMult=p.stamina<ST.fatigueBelow?ST.fatigueMult:1;
  for(const s in p.skillCDs)p.skillCDs[s]=Math.max(0,p.skillCDs[s]-dt);
  if(p.skillT>0){p.skillT-=dt;}else if(p.activeSkill){p.activeSkill=null;}

  const moving=Math.hypot(inp.dx,inp.dy)>0.1;
  // Sprinting drains stamina; an empty tank means no sprint until it recovers
  const sprinting=inp.sprint&&moving&&p.stamina>0;
  if(sprinting)p.stamina=Math.max(0,p.stamina-ST.sprintDrain*dt);
  else p.stamina=Math.min(ST.max,p.stamina+ST.regenPerFrame*dt);
  const spd=(sprinting?SPRINTSPD:WALK)*fatigueMult*(p.missT>0?BALANCE.duel.missSlowMult:1);
  p.x+=inp.dx*spd*dt; p.y+=inp.dy*spd*dt;
  p.x=clamp(p.x,PX+PRAD,PX+PW-PRAD);
  p.y=clamp(p.y,PY+PRAD,PY+PH-PRAD);

  if(moving&&Math.abs(inp.dx)>0.15){
    const nd=inp.dx>0?1:-1;
    if(nd!==cs.lastDir&&ball.owner===p){
      cs.dirChanges++;cs.dirChangeT=0;
      if(cs.dirChanges>=MOVEMENT.dribbleChangesNeeded){showCallout('NICE DRIBBLE!',p.x,p.y-26);cs.dirChanges=0;}
    }
    cs.lastDir=nd; p.dir=nd;
  }
  cs.dirChangeT+=dt; if(cs.dirChangeT>MOVEMENT.dribbleWindow)cs.dirChanges=0;
  p.state=moving?'run':'idle';
  if(moving){
    const rate=sprinting?MOVEMENT.sprintFrameRate:MOVEMENT.walkFrameRate;
    p.frameT+=dt*16.67;
    if(p.frameT>=rate){p.frame=(p.frame+1)%4;p.frameT=0;}
  } else {p.frame=0;p.frameT=0;}

  // Sprint with ball POWER! callout
  if(sprinting&&ball.owner===p){
    cs.sprintTime+=dt/60;
    if(cs.sprintTime>MOVEMENT.sprintCalloutDelay&&cs.sprintTime<MOVEMENT.sprintCalloutDelay+0.1)
      showCallout('POWER! ⚡',p.x,p.y-26);
    if(Math.floor(cs.sprintTime*10)%MOVEMENT.sprintRumblePeriod===0)rumbleSprint();
  } else cs.sprintTime=0;

  // Sprint dust + trails + weather splashes
  if(moving&&weatherMode==='rain'&&Math.random()<0.18*dt)spawnSplash(p.x+(Math.random()-0.5)*5,p.y+5);
  if(sprinting){
    if(Math.random()<0.3)spawnDust(p.x,p.y+5,inp.dx*SPRINTSPD,inp.dy*SPRINTSPD,3);
    if(Math.random()<BALANCE.trail.spawnChance)trails.push({x:p.x,y:p.y,frame:p.frame,dir:p.dir,a:BALANCE.trail.initialAlpha,tc:COL[p.team]});
  }
  if (p.hatTrickMode && moving && Math.random() < 0.4) {
      spawnSparks(p.x, p.y + 5, 'orange', 2);
  }

  // Pick up loose ball
  if(!ball.owner&&!ball.shielded&&p.kickCD<=0&&dst(p,ball)<PRAD+BRAD+PHYSICS.ball.pickupRadius+(ball.passTo===p?BALANCE.pass.receiveBonus:0)&&ball.z<PHYSICS.ball.maxPickupZ)ball.owner=p;

  // ── Kick state machine ──────────────────────────────────────────────────
  const CH=POWER.charge, TP=POWER.tap, TK=POWER.tackle;
  if(cs.kickState==='charging'&&ball.owner!==p){
    cs.kickState='idle';cs.kickCharge=0; // stolen while charging
  }
  if(cs.kickState==='idle'&&inp.kickHeld&&ball.owner===p&&p.kickCD<=0){
    cs.kickState='charging';
  }
  if(cs.kickState==='charging'){
    if(inp.kickHeld){
      const maxCharge = p.overallStars >= 3 ? 1.5 : 1.0;
      if (!cs.chargeDir) cs.chargeDir = 1;
      cs.kickCharge += cs.chargeDir * (dt / (CH.chargeTime * 0.7)); // Faster oscillation
      if(cs.kickCharge >= maxCharge) {
          cs.kickCharge = maxCharge;
          cs.chargeDir = -1;
      } else if (cs.kickCharge <= 0) {
          cs.kickCharge = 0;
          cs.chargeDir = 1;
      }
    } else {
      // Release — fire!
      const power=cs.kickCharge;
      ball.owner=null; lastKicker=p;
      const goalX=p.dir>0?PX+PW+GD:PX-GD;
      let bx,by;
      if(inp.aimActive){
        [bx,by]=nrm(inp.aimDx,inp.aimDy);
        by+=(Math.random()-0.5)*4*(1-power)*0.08;
      } else {
        const scatter=(Math.random()-0.5)*lerp(CH.minScatter,CH.maxScatter,power);
        [bx,by]=nrm(goalX-p.x,MY-p.y+scatter);
      }
      const is3Star = p.overallStars >= 3;
      const staminaEffectiveness = Math.max(0.6, p.stamina / 100);

      if(power > 1.0 && is3Star){
        if (canSkill(p, 'powerShot')) activateSkill(p,'powerShot');
        const PS=SKILLS.powerShot;
        const vel = 1.35 * staminaEffectiveness;
        ball.vx=bx*PS.velocity * vel; ball.vy=by*PS.velocity * vel;
        ball.z=4.5; ball.vz=1.8;
        ball.onFire = true;
        ball.isCurveShot = false;
        ball.bypassesKeeper = true;
        p.stamina = Math.max(0, p.stamina - 35);
        showCallout('FIREBALL! 🔥', p.x, p.y-28);
        addHitStop(FX.fireballHitStop); addShake(FX.fireballShake);
      } else if(power >= 0.5) {
        ball.onFire = false;
        ball.isCurveShot = true;
        ball.bypassesKeeper = Math.random() < (0.6 * staminaEffectiveness);
        const vel = 1.5 * staminaEffectiveness;
        const v=lerp(CH.minVelocity,CH.maxVelocity,power) * vel;
        ball.vx=bx*v; ball.vy=by*v;
        ball.z=2; ball.vz=1.2;
        const gy = MY - p.y;
        ball.curveForce = Math.sign(gy) * 0.55 * staminaEffectiveness; 
        p.stamina = Math.max(0, p.stamina - 15);
        showCallout('CURVE SHOT! 🌀', p.x, p.y-28);
      } else {
        ball.onFire = false;
        ball.isCurveShot = false;
        ball.bypassesKeeper = false;
        const vel = Math.max(0.8, staminaEffectiveness);
        const v=lerp(CH.minVelocity,CH.maxVelocity,power) * vel;
        ball.vx=bx*v; ball.vy=by*v;
        ball.z=lerp(CH.minZ,CH.maxZ,power);
        ball.vz=lerp(CH.minLift,CH.maxLift,power);
      }
      p.kickCD=CH.kickCooldown; p.state='kick';
      spawnSparks(p.x+p.dir*8,p.y,'kick',Math.floor(power*12)+4);
      lastShotPower=(power > 1.0 && is3Star);
      // Charged shots fly past outfield players; only the keeper can stop them
      ball.shielded=power>=0.5; ball.passTo=null;
      if(power > 1.0 && is3Star){sndBoom();}
      else if(power>=CH.boomThreshold){showCallout('BOOM! 🔥',p.x,p.y-28);rumbleBoom();sndBoom();}
      else if(power>=CH.niceThreshold){showCallout('NICE SHOT!',p.x,p.y-26);rumbleNiceShot();sndNiceShot();}
      else{rumbleTap();sndTap();}
      if(devStats)devStats.shots[p.team==='home'?0:1]++;
      cs.kickState='idle';cs.kickCharge=0;
    }
  }
  // Tap kick loose ball
  if(cs.kickState==='idle'&&inp.kickHeld&&!cs.prevKickHeld&&p.kickCD<=0&&!ball.owner&&dst(p,ball)<TP.range&&ball.z<PHYSICS.ball.maxPickupZ+2){
    const goalX=p.dir>0?PX+PW+GD:PX-GD;
    let bx,by;
    if(inp.aimActive){[bx,by]=nrm(inp.aimDx,inp.aimDy);}
    else{[bx,by]=nrm(goalX-p.x,MY-p.y+(Math.random()-0.5)*22);}
    ball.vx=bx*TP.velocity; ball.vy=by*TP.velocity;
    ball.z=TP.z; ball.vz=TP.vz;
    p.kickCD=TP.kickCooldown; p.state='kick';
    spawnSparks(ball.x,ball.y,'kick',5); rumbleTap();
    if(devStats)devStats.shots[p.team==='home'?0:1]++;
  }
  cs.prevKickHeld=inp.kickHeld;

  // Quick pass (Square/X / E key) — instant ground pass to best forward teammate
  if(inp.passPressed&&ball.owner===p&&cs.kickState==='idle'){
    // Pick the receiver: the teammate the stick points at; otherwise the best
    // forward option. Blocked lanes and tightly marked players are avoided.
    const mates=(p.team==='home'?home:away).filter(m=>m!==p);
    const opps=p.team==='home'?away:home;
    const d2=p.team==='home'?1:-1;
    const aim=Math.hypot(inp.dx,inp.dy)>0.3?nrm(inp.dx,inp.dy):null;
    let best=null,bs=-Infinity;
    for(const m of mates){
      const d=dst(p,m);
      const open=Math.min(60,Math.min(...opps.map(o=>dst(o,m))));
      const blocked=passLaneBlocked(p,m,opps);
      let s;
      if(aim){
        const al=((m.x-p.x)*aim[0]+(m.y-p.y)*aim[1])/(d||1);
        if(al<0.35)continue;
        s=al*120-d*0.1-(blocked?90:0)+open*0.3;
      } else {
        s=d2*(m.x-p.x)*0.5-d*0.12-(blocked?200:0)+open*0.6-(m.role==='gk'?60:0);
      }
      if(s>bs){bs=s;best=m;}
    }
    if(best){
      makePass(p,best);
      p.kickCD=TP.kickCooldown; p.state='kick';
      spawnSparks(p.x,p.y,'green',4); rumbleTap();
    }
  }

  // Tackle
  if(inp.tacklePressed&&p.tackleCD<=0){
    const carrier=ball.owner;
    if(carrier&&carrier.team!==p.team&&dst(p,carrier)<PRAD*TK.rangeMultiplier&&!inGrace()&&rollTackle(p,carrier)){
      ball.owner=null;
      ball.vx=p.dir*TK.forwardVelocity+(Math.random()-0.5)*TK.lateralRandom;
      ball.vy=(Math.random()-0.5)*TK.lateralRandom;
      p.tackleCD=TK.cooldown;
      showCallout('TACKLE!',p.x,p.y-22);
      spawnSparks(carrier.x,carrier.y,'orange',6); rumbleTackle();
    }
  }
}

// ── TRAJECTORY ARC ────────────────────────────────────────────────────────────
function drawArc(p, inp, cs=ctrl1){
  if(cs.kickCharge<0.01)return;
  const CH=POWER.charge, TR=BALANCE.trajectory;
  const aimActive=inp?.aimActive;
  const goalX=p.dir>0?PX+PW+GD:PX-GD;
  const[bx,by]=aimActive ? nrm(inp.aimDx,inp.aimDy) : nrm(goalX-p.x,MY-p.y);
  const v=lerp(CH.minVelocity,CH.maxVelocity,cs.kickCharge);
  let sx=p.x+p.dir*8,sy=p.y+3,sz=lerp(CH.minZ,CH.maxZ,cs.kickCharge),svz=lerp(CH.minLift,CH.maxLift,cs.kickCharge);
  let svx=bx*v,svy=by*v;
  // Cyan dots = manual aim, yellow = auto-aim
  const dotCol=aimActive?'#67e8f9':'#fde047';
  cx.save();
  for(let i=0;i<TR.steps;i++){
    sx+=svx*TR.stepSize;sy+=svy*TR.stepSize;sz+=svz*TR.stepSize;svz-=TR.gravity;
    if(sz<0)break;
    if(i%TR.drawInterval===0){
      const a=Math.max(0,TR.baseAlpha-i*TR.alphaDecay);
      cx.globalAlpha=a;
      cx.fillStyle='#000';cx.fillRect(Math.round(sx)-2,Math.round(sy-sz)-2,4,4);
      cx.fillStyle=dotCol;cx.fillRect(Math.round(sx)-1,Math.round(sy-sz)-1,3,3);
    }
  }
  cx.globalAlpha=1;cx.restore();
}

// ── SEPARATE PLAYERS ─────────────────────────────────────────────────────────
function separatePlayers(){
  const all=[...home,...away];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j],d=dst(a,b);
    const sep=PRAD*PHYSICS.player.separationFactor;
    if(d<sep&&d>0.01){
      const push=(sep-d)/2;
      const nx=(a.x-b.x)/d,ny=(a.y-b.y)/d;
      a.x+=nx*push;a.y+=ny*push;b.x-=nx*push;b.y-=ny*push;
    }
  }
}

// ── FX: shake, hit-stop, goal celebration, boards, pitch wear, puddles ──────
// Game-feel layer. Tunables live in BALANCE.fx.
const FX=BALANCE.fx;
let fxT=0, shakeMag=0, hitStop=0, camPunch=0, punchT=999, lightningT=0, weatherFade=1;
let goalBanner=null, netFx=null;
const confetti=[], puddles=[], ballTrail=[];
const wearC=document.createElement('canvas'); wearC.width=LW; wearC.height=LH;
const wg=wearC.getContext('2d');

function addShake(m){ shakeMag=Math.max(shakeMag,m); }
function addHitStop(f){ hitStop=Math.max(hitStop,f); }
function resetFx(){
  wg.clearRect(0,0,LW,LH); puddles.length=0; confetti.length=0; ballTrail.length=0;
  goalBanner=null; netFx=null; shakeMag=0; hitStop=0; camPunch=0; punchT=999; lightningT=0;
}
function tickFx(dt){
  fxT+=dt;
  shakeMag*=Math.pow(0.82,dt); if(shakeMag<0.15)shakeMag=0;
  if(hitStop>0)hitStop=Math.max(0,hitStop-dt);
  // camera punch: quick in, hold, ease out
  punchT+=dt;
  camPunch=punchT<8?FX.goalPunch*punchT/8:punchT<50?FX.goalPunch:punchT<90?FX.goalPunch*(1-(punchT-50)/40):0;
  if(ball)ball.squash=(ball.squash||0)*Math.pow(0.78,dt);
  if(goalBanner){goalBanner.t+=dt;if(goalBanner.t>125)goalBanner=null;}
  if(netFx){netFx.t+=dt;if(netFx.t>70)netFx=null;}
  if(lightningT>0)lightningT=Math.max(0,lightningT-dt);
  for(const c of confetti){
    c.life+=dt; c.vy=Math.min(c.vy+0.035*dt,1.6); c.vx*=Math.pow(0.99,dt);
    c.x+=(c.vx+Math.sin(c.life*0.12+c.ph)*0.45)*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt;
  }
  confetti.splice(0,confetti.length,...confetti.filter(c=>c.life<c.max&&c.y<LH+VOY+10));
}

// ── Goal celebration ──
function startGoalFx(team){
  const side=team===0?1:-1;
  addHitStop(FX.goalHitStop); addShake(FX.goalShake); punchT=0;
  netFx={side,by:clamp(ball.y,MY-GH/2+4,MY+GH/2-4),t:0};
  const scorer=lastKicker&&lastKicker.team===(team===0?'home':'away')?lastKicker.name:null;
  goalBanner={t:0,team:team===0?'home':'away',sub:scorer?scorer.toUpperCase():(team===0?'NAIJA':'AWAY')};

      rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,w:2+Math.random()*2.5,h:1+Math.random()*1.5,
      col:cols[i%cols.length],ph:Math.random()*6,life:0,max:150+Math.random()*60});

const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function drawGoalBanner(){
  if(!goalBanner)return;
  const{t}=goalBanner, txt='GOOOAL!';
  const out=t>105?Math.min(1,(t-105)/20):0;
  cx.save();
  cx.font="900 46px 'Orbitron',monospace"; cx.textAlign='left'; cx.textBaseline='middle';
  const total=cx.measureText(txt).width;
  let x=MX-total/2*(1+out*0.4);
  const y=MY-34;
  cx.globalAlpha=1-out;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i], w=cx.measureText(ch).width*(1+out*0.4);
    const lt=t-i*3;
    if(lt>0){
      const k=Math.min(1,lt/14), sc=(lt<14?0.2+0.8*easeOutBack(k):1)*(1+out*0.4);
      const wob=Math.sin((t+i*4)*0.25)*1.5*(1-out);
      cx.save(); cx.translate(x+w/2,y+wob-(1-Math.min(1,lt/8))*30); cx.scale(sc,sc);
      cx.shadowColor='#FFB800'; cx.shadowBlur=14;
      cx.lineWidth=5; cx.strokeStyle='#000'; cx.strokeText(ch,-w/2/(1+out*0.4),0);
      cx.shadowBlur=0; cx.fillStyle=i%2?'#FFB800':COL[goalBanner.team].shirt; cx.fillText(ch,-w/2/(1+out*0.4),0);
      cx.restore();

    cx.fillStyle='#fff'; cx.fillText('⚽ '+goalBanner.sub,MX,y+36);
  }
  cx.restore();
}
function drawConfetti(){
  for(const c of confetti){
    cx.save(); cx.globalAlpha=Math.min(1,(c.max-c.life)/30);
    cx.translate(c.x,c.y); cx.rotate(c.rot); cx.scale(1,Math.abs(Math.cos(c.life*0.15+c.ph)));
    cx.fillStyle=c.col; cx.fillRect(-c.w/2,-c.h/2,c.w,c.h); cx.restore();
  }
}
// Net bulges where the ball hit it, then settles
function drawNetFx(){
  if(!netFx)return;
  const{side,by,t}=netFx, x0=side>0?PX+PW:PX, x1=x0+side*GD, top=MY-GH/2, bot=MY+GH/2;
  const amp=7*Math.exp(-t/22)*Math.cos(t*0.35);
  const bulge=(y,f)=>side*amp*f*Math.exp(-(((y-by)/20)**2));
  cx.save();
  cx.fillStyle='#1a1a2e'; cx.fillRect(Math.min(x0,x1),top,GD,GH);
  cx.strokeStyle='rgba(255,255,255,0.28)'; cx.lineWidth=0.6;
  for(let ny=top;ny<=bot;ny+=7){
    cx.beginPath();
    for(let k=0;k<=6;k++){const f=k/6, x=x0+(x1-x0)*f;cx[k?'lineTo':'moveTo'](x+bulge(ny,f),ny);}
    cx.stroke();
  }
  for(let k=0;k<=Math.floor(GD/7);k++){
    const f=(k*7)/GD, x=x0+side*k*7;
    cx.beginPath();
    for(let ny=top;ny<=bot;ny+=3)cx[ny===top?'moveTo':'lineTo'](x+bulge(ny,f),ny);
    cx.stroke();
  }
  cx.strokeStyle='#fff'; cx.lineWidth=2; cx.strokeRect(Math.min(x0,x1),top,GD,GH);
  cx.restore();
}

const BOARD_ADS=['NAIJA 5s','SUPER LEAGUE','JOLLOF ★ HOT','EJE O!','SUYA SPOT','PLAY ON MOBILE',

  g.fillStyle='rgba(0,0,0,0.38)';g.fillRect(1,0,1,2);g.fillRect(0,1,2,1);return c;})();
function drawBoards(){
  const n=6, gap=2, pw=(PW-gap*(n-1))/n, H=7;

// ── Pitch wear: footsteps and tackles slowly scuff the grass ──
function wearColor(a){
  return weatherMode==='rain'?`rgba(78,54,30,${a*1.5})`:weatherMode==='snow'?`rgba(226,236,250,${a*1.3})`:`rgba(30,54,24,${a})`;
}
function stampWear(x,y,r,a){
  if(x<PX||x>PX+PW||y<PY||y>PY+PH)return;
  wg.fillStyle=wearColor(a); wg.beginPath(); wg.ellipse(x,y,r*1.4,r*0.8,0,0,Math.PI*2); wg.fill();
}
function stampStreak(x0,y0,x1,y1){
  for(let k=0;k<=6;k++){const f=k/6;stampWear(x0+(x1-x0)*f,y0+(y1-y0)*f,2.2,FX.wearAlpha*2.4);}
}
function stepFx(p){
  // called when a running foot lands: turf kick + wear
  const col=weatherMode==='rain'?'rgba(140,188,255,0.75)':weatherMode==='snow'?'#eef4ff':`hsl(${100+Math.random()*25},45%,${28+Math.random()*14}%)`;
